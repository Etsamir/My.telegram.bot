<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Night Shift - Axon Body 3</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; user-select: none; touch-action: none; }
        #blocker {
            position: absolute; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;
            font-family: 'Courier New', Courier, monospace; cursor: default; z-index: 10;
        }
        #blocker h1 { margin-bottom: 10px; letter-spacing: 4px; }
        .language-selector, .platform-selector { margin: 20px; display: flex; gap: 20px; }
        .language-selector label, .platform-selector label { cursor: pointer; padding: 5px 15px; border: 1px solid #555; border-radius: 4px; background: #222; transition: 0.3s; }
        .language-selector label.selected, .platform-selector label.selected { background: #0a4; border-color: #0f0; color: #0f0; }
        .language-selector input, .platform-selector input { display: none; }
        #start-btn {
            padding: 15px 40px; font-size: 24px; font-family: 'Courier New', monospace;
            background: #0a4; color: white; border: none; border-radius: 8px;
            cursor: pointer; box-shadow: 0 0 20px #0a4; transition: 0.3s; margin-top: 20px;
        }
        #start-btn:hover { background: #0f6; box-shadow: 0 0 30px #0f6; }
        #start-text { margin-top: 20px; font-size: 14px; color: #aaa; text-align: center; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background-color: rgba(255,255,255,0.8); transform: translate(-50%, -50%);
            border-radius: 50%; z-index: 5; pointer-events: none;
        }
        #bodycam-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 8; display: none;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8); 
        }
        .rec-text {
            position: absolute; top: 30px; right: 40px; color: #ff3333;
            font-family: 'Courier New', monospace; font-size: 24px; font-weight: bold;
            text-shadow: 0 0 5px red; animation: blink 1s infinite;
        }
        .time-text {
            position: absolute; top: 35px; left: 40px; color: white;
            font-family: 'Courier New', monospace; font-size: 18px; text-shadow: 0 0 3px white;
        }
        .task-text {
            position: absolute; top: 80px; left: 40px; color: #00ffaa;
            font-family: 'Courier New', monospace; font-size: 16px; text-shadow: 0 0 3px #00ffaa;
            line-height: 1.5;
        }
        .status-text {
            position: absolute; top: 35px; left: 50%; transform: translateX(-50%); color: #00ffaa;
            font-family: 'Courier New', monospace; font-size: 16px; text-shadow: 0 0 3px #00ffaa;
            display: flex; gap: 20px;
        }
        .inventory-text {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); color: #ffaa00;
            font-family: 'Courier New', monospace; font-size: 20px; font-weight: bold;
            text-shadow: 0 0 5px #ffaa00; transition: color 0.3s;
        }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0;} 100% {opacity: 1;} }

        /* Мобильное управление */
        #mobile-controls {
            position: absolute; bottom: 30px; left: 0; width: 100%;
            display: flex; justify-content: space-between; padding: 0 20px;
            box-sizing: border-box; pointer-events: none; z-index: 20;
        }
        .move-panel, .action-panel { display: flex; gap: 15px; pointer-events: auto; }
        .action-panel { flex-direction: column; justify-content: flex-end; }
        .ctrl-btn {
            width: 60px; height: 60px; border-radius: 50%;
            background: rgba(50,50,50,0.8); border: 2px solid #0f0;
            color: #0f0; font-size: 24px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px #0f0; user-select: none; touch-action: none;
        }
        .ctrl-btn:active { background: #0f0; color: #000; }
        #sprint-btn { border-color: #00aaff; color: #00aaff; box-shadow: 0 0 15px #00aaff; }
        #sprint-btn:active { background: #00aaff; color: #000; }
    </style>
</head>
<body>
    <div id="blocker">
        <h1 style="text-align:center">AXON BODY 3</h1>
        
        <div class="language-selector">
            <label class="selected"><input type="radio" name="lang" value="ru" checked> Русский</label>
            <label><input type="radio" name="lang" value="uz"> O'zbekcha</label>
            <label><input type="radio" name="lang" value="en"> English</label>
        </div>

        <div class="platform-selector">
            <label class="selected"><input type="radio" name="platform" value="pc" checked> ПК</label>
            <label><input type="radio" name="platform" value="mobile"> Мобильный</label>
        </div>

        <button id="start-btn">Начать смену</button>
        <p id="start-text">Загрузка системы...<br><span style="color:#555;font-size:12px;">Управление: WASD - Ходьба | SHIFT - Бег | ЛКМ - Действие</span></p>
    </div>
    
    <div id="bodycam-ui">
        <div id="ui-time" class="time-text">03:45 AM <br> SYS: ONLINE</div>
        <div id="ui-task" class="task-text">ЗАДАЧИ:<br>[ ] Выключить ПК: 0/20<br>[ ] Выбросить мусор: 0/0</div>
        <div class="status-text">
            <div id="ui-battery" style="display:none;">🔋 100%</div>
            <div id="ui-stamina">🏃 100%</div>
        </div>
        <div id="ui-inventory" class="inventory-text" style="display:none;">В РУКАХ: 0 / 3</div>
        <div class="rec-text">● REC</div>
    </div>
    <div id="crosshair"></div>

    <div id="mobile-controls" style="display: none;">
        <div class="move-panel">
            <div style="display:flex; flex-direction:column; gap:10px; align-items:center;">
                <div class="ctrl-btn" id="move-fwd">↑</div>
                <div style="display:flex; gap:40px;">
                    <div class="ctrl-btn" id="move-left">←</div>
                    <div class="ctrl-btn" id="move-right">→</div>
                </div>
                <div class="ctrl-btn" id="move-back">↓</div>
            </div>
        </div>
        <div class="action-panel">
            <div class="ctrl-btn" id="sprint-btn">🏃</div>
            <div class="ctrl-btn" id="action-btn">E</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // ========== ПЕРЕВОДЫ ==========
        const translations = {
            ru: {
                rec: '● REC', timeOnline: '03:45 AM <br> SYS: ONLINE', timePowerFail: '03:45 AM <br> СБОЙ ПИТАНИЯ', timeBackup: '03:46 AM <br> РЕЗЕРВНОЕ ПИТАНИЕ',
                tasks: 'ЗАДАЧИ:', taskPC: '[ ] Выключить ПК: {current}/20', taskPCDone: '[✓] ПК выключены (20/20)',
                taskTrash: '[ ] Выбросить мусор: {current}/{total}', taskTrashDone: '[✓] Мусор выброшен ({total}/{total})',
                taskBlackout: 'СБОЙ ПИТАНИЯ!<br>НАЙДИТЕ ФОНАРИК НА СТОЛЕ АДМИНА!', taskComplete: 'СИСТЕМА СБРОШЕНА.<br>ПОКИНЬТЕ КЛУБ!',
                inventory: 'В РУКАХ: {current} / {max}', inventoryFull: 'ИНВЕНТАРЬ ПОЛОН! НЕСИ В БАК.',
                startBtn: 'Начать смену', startText: 'СИСТЕМА ГОТОВА.', endWin: 'СМЕНА ОКОНЧЕНА.<br>ВЫ ВЫЖИЛИ.', endLose: 'ВАС СХВАТИЛИ.<br>СМЕНА ПРОВАЛЕНА.'
            },
            uz: {
                rec: '● YOZILMOQDA', timeOnline: '03:45 AM <br> TIZIM: ISHLASH', timePowerFail: '03:45 AM <br> QUVVAT UZILDI', timeBackup: '03:46 AM <br> ZAXIRA QUVVAT',
                tasks: 'VAZIFALAR:', taskPC: '[ ] Kompyuterni o\'chirish: {current}/20', taskPCDone: '[✓] Kompyuterlar o\'chirildi (20/20)',
                taskTrash: '[ ] Axlatni tashlash: {current}/{total}', taskTrashDone: '[✓] Axlat tashlandi ({total}/{total})',
                taskBlackout: 'QUVVAT UZILDI!<br>ADMIN STOLIDAN CHIROQNI TOPING!', taskComplete: 'TIZIM TOZALANDI.<br>KLUBDAN CHIQING!',
                inventory: 'QO\'LDA: {current} / {max}', inventoryFull: 'INVENTAR TO\'LA! AXLAT QUTISIGA OLIB BOR.',
                startBtn: 'Smenani boshlash', startText: 'TIZIM TAYYOR.', endWin: 'SMENA TUGADI.<br>SIZ OMON QOLDINGIZ.', endLose: 'SIZ TUTILDINGIZ.<br>SMENA BARBOD.'
            },
            en: {
                rec: '● REC', timeOnline: '03:45 AM <br> SYS: ONLINE', timePowerFail: '03:45 AM <br> POWER FAILURE', timeBackup: '03:46 AM <br> BACKUP POWER',
                tasks: 'TASKS:', taskPC: '[ ] Turn off PCs: {current}/20', taskPCDone: '[✓] PCs off (20/20)',
                taskTrash: '[ ] Throw trash: {current}/{total}', taskTrashDone: '[✓] Trash thrown ({total}/{total})',
                taskBlackout: 'POWER FAILURE!<br>FIND FLASHLIGHT ON ADMIN DESK!', taskComplete: 'SYSTEM RESET.<br>LEAVE THE CLUB!',
                inventory: 'HOLDING: {current} / {max}', inventoryFull: 'INVENTORY FULL! TAKE TO BIN.',
                startBtn: 'Start Shift', startText: 'SYSTEM READY.', endWin: 'SHIFT COMPLETE.<br>YOU SURVIVED.', endLose: 'YOU WERE CAUGHT.<br>SHIFT FAILED.'
            }
        };

        let currentLanguage = 'ru';
        let currentPlatform = 'pc';

        const langRadios = document.querySelectorAll('input[name="lang"]');
        const platformRadios = document.querySelectorAll('input[name="platform"]');
        const startBtn = document.getElementById('start-btn');
        const startText = document.getElementById('start-text');
        const blocker = document.getElementById('blocker');
        const bodycamUI = document.getElementById('bodycam-ui');
        const uiTask = document.getElementById('ui-task');
        const uiTime = document.getElementById('ui-time');
        const uiInventory = document.getElementById('ui-inventory');
        const uiBattery = document.getElementById('ui-battery');
        const uiStamina = document.getElementById('ui-stamina');
        const recElement = document.querySelector('.rec-text');
        const mobileControls = document.getElementById('mobile-controls');

        function updateUILanguage() {
            const t = translations[currentLanguage];
            startBtn.textContent = t.startBtn;
        }

        langRadios.forEach(radio => radio.addEventListener('change', (e) => {
            document.querySelectorAll('.language-selector label').forEach(l => l.classList.remove('selected'));
            e.target.parentElement.classList.add('selected'); currentLanguage = e.target.value; updateUILanguage();
        }));

        platformRadios.forEach(radio => radio.addEventListener('change', (e) => {
            document.querySelectorAll('.platform-selector label').forEach(l => l.classList.remove('selected'));
            e.target.parentElement.classList.add('selected'); currentPlatform = e.target.value;
        }));

        updateUILanguage();

        // ========== ЗВУКОВАЯ СИСТЕМА (ПРОЦЕДУРНАЯ) ==========
        let audioContext = null;
        let footstepsBuffer, pickupBuffer, pcOffBuffer, blackoutBuffer, monsterSpawnBuffer, monsterFootstepBuffer, doorOpenBuffer, deathBuffer;

        function initAudio() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') audioContext.resume();
            footstepsBuffer = createNoiseBuffer(0.2, 0.1, 200);
            pickupBuffer = createToneBuffer(0.15, 600, 'sine');
            pcOffBuffer = createToneBuffer(0.2, 100, 'sawtooth');
            blackoutBuffer = createNoiseBuffer(1.5, 0.3, 60);
            monsterSpawnBuffer = createNoiseBuffer(0.8, 0.2, 80);
            monsterFootstepBuffer = createToneBuffer(0.3, 60, 'triangle');
            doorOpenBuffer = createToneBuffer(0.5, 400, 'sine', 0.3);
            deathBuffer = createNoiseBuffer(1.0, 0.5, 150);
        }

        function createNoiseBuffer(duration, volume, lowpassFreq) {
            if (!audioContext) return null;
            const sampleRate = audioContext.sampleRate; const buffer = audioContext.createBuffer(1, sampleRate * duration, sampleRate);
            const data = buffer.getChannelData(0); let prev = 0;
            const k = lowpassFreq > 0 ? Math.exp(-2 * Math.PI * lowpassFreq / sampleRate) : 0;
            for (let i = 0; i < buffer.length; i++) {
                data[i] = (Math.random() * 2 - 1) * volume;
                if (k > 0) { data[i] = prev + (data[i] - prev) * (1 - k); prev = data[i]; }
            }
            return buffer;
        }

        function createToneBuffer(duration, frequency, type = 'sine', volume = 0.3) {
            if (!audioContext) return null;
            const sampleRate = audioContext.sampleRate; const buffer = audioContext.createBuffer(1, sampleRate * duration, sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < buffer.length; i++) data[i] = Math.sin(2 * Math.PI * frequency * i / sampleRate) * volume * (1 - i / buffer.length);
            return buffer;
        }

        function playSound(buffer, volume = 0.5, pitch = 1.0) {
            if (!audioContext || !buffer) return;
            if (audioContext.state === 'suspended') audioContext.resume();
            const source = audioContext.createBufferSource(); source.buffer = buffer; source.playbackRate.value = pitch;
            const gainNode = audioContext.createGain(); gainNode.gain.value = volume;
            source.connect(gainNode).connect(audioContext.destination); source.start();
        }

        // ========== ИГРОВАЯ ЛОГИКА ==========
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0a0a, 0.06); 
        const camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        // ВАЖНО: Включаем рендеринг теней
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        let controls;
        if (currentPlatform === 'pc') controls = new THREE.PointerLockControls(camera, document.body);
        else controls = { isLocked: true, lock: () => {}, unlock: () => {} };

        let gameEnded = false; let gameWin = false;
        let stamina = 100; let battery = 100; // Новые механики

        startBtn.addEventListener('click', () => {
            initAudio();
            if (currentPlatform === 'pc') { if (!gameEnded) controls.lock(); } 
            else startMobileGame();
        });

        function startMobileGame() {
            blocker.style.display = 'none'; bodycamUI.style.display = 'block'; mobileControls.style.display = 'flex';
            camera.position.set(-4.5, 1.7, 2); setupMobileControls(); updateUI();
        }

        if (currentPlatform === 'pc') {
            controls.addEventListener('lock', () => { blocker.style.display = 'none'; bodycamUI.style.display = 'block'; updateUI(); });
            controls.addEventListener('unlock', () => { if (!gameEnded) { blocker.style.display = 'flex'; bodycamUI.style.display = 'none'; } });
        }

        const velocity = new THREE.Vector3(); const direction = new THREE.Vector3();
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, isSprinting = false;

        document.addEventListener('keydown', (e) => {
            if (currentPlatform !== 'pc') return;
            if(e.code === 'KeyW') moveForward = true; if(e.code === 'KeyA') moveLeft = true;
            if(e.code === 'KeyS') moveBackward = true; if(e.code === 'KeyD') moveRight = true;
            if(e.code === 'ShiftLeft') isSprinting = true;
        });
        document.addEventListener('keyup', (e) => {
            if (currentPlatform !== 'pc') return;
            if(e.code === 'KeyW') moveForward = false; if(e.code === 'KeyA') moveLeft = false;
            if(e.code === 'KeyS') moveBackward = false; if(e.code === 'KeyD') moveRight = false;
            if(e.code === 'ShiftLeft') isSprinting = false;
        });

        // Мобильное управление
        let mobileControlsInitialized = false;
        function setupMobileControls() {
            if (mobileControlsInitialized) return; mobileControlsInitialized = true;
            const btnF = document.getElementById('move-fwd'), btnB = document.getElementById('move-back');
            const btnL = document.getElementById('move-left'), btnR = document.getElementById('move-right');
            const actBtn = document.getElementById('action-btn'), sprBtn = document.getElementById('sprint-btn');
            
            btnF.addEventListener('touchstart', (e) => { e.preventDefault(); moveForward = true; }); btnF.addEventListener('touchend', (e) => { e.preventDefault(); moveForward = false; });
            btnB.addEventListener('touchstart', (e) => { e.preventDefault(); moveBackward = true; }); btnB.addEventListener('touchend', (e) => { e.preventDefault(); moveBackward = false; });
            btnL.addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft = true; }); btnL.addEventListener('touchend', (e) => { e.preventDefault(); moveLeft = false; });
            btnR.addEventListener('touchstart', (e) => { e.preventDefault(); moveRight = true; }); btnR.addEventListener('touchend', (e) => { e.preventDefault(); moveRight = false; });
            sprBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isSprinting = true; sprBtn.style.background = '#00aaff'; sprBtn.style.color = '#000'; });
            sprBtn.addEventListener('touchend', (e) => { e.preventDefault(); isSprinting = false; sprBtn.style.background = 'rgba(50,50,50,0.8)'; sprBtn.style.color = '#00aaff';});
            actBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (!gameEnded) handleInteraction(); });
        }

        let lastTouchX = 0, lastTouchY = 0, pitch = 0, yaw = 0; const PI_2 = Math.PI / 2;
        document.addEventListener('touchstart', (e) => { if (currentPlatform === 'mobile' && !gameEnded && blocker.style.display === 'none') { lastTouchX = e.touches[0].clientX; lastTouchY = e.touches[0].clientY; } });
        document.addEventListener('touchmove', (e) => {
            if (currentPlatform !== 'mobile' || gameEnded || blocker.style.display !== 'none') return; e.preventDefault();
            const touch = e.touches[0]; yaw -= (touch.clientX - lastTouchX) * 0.005; pitch -= (touch.clientY - lastTouchY) * 0.005;
            pitch = Math.max(-PI_2 + 0.1, Math.min(PI_2 - 0.1, pitch));
            camera.rotation.y = yaw; camera.rotation.x = pitch;
            lastTouchX = touch.clientX; lastTouchY = touch.clientY;
        });

        // ========== ГЕОМЕТРИЯ С ТЕНЯМИ ==========
        function createTileTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256; const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#080808'; ctx.fillRect(0,0,256,256); ctx.strokeStyle = '#151515'; ctx.lineWidth = 4; ctx.strokeRect(0,0,256,256);
            const tex = new THREE.CanvasTexture(canvas); tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(18, 12); return tex;
        }
        function createWallTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 256; const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#111111'; ctx.fillRect(0,0,128,256); ctx.fillStyle = '#151515'; ctx.fillRect(0,0,64,256); 
            const tex = new THREE.CanvasTexture(canvas); tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; return tex;
        }

        const roomW = 18, roomD = 12, roomH = 3.8; 
        const floorTex = createTileTexture(); const wallTex = createWallTexture(); wallTex.repeat.set(roomW/2, 1); const wallTexShort = createWallTexture(); wallTexShort.repeat.set(roomD/2, 1);
        const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.7 }); const wallMatLong = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 1 });
        const wallMatShort = new THREE.MeshStandardMaterial({ map: wallTexShort, roughness: 1 }); const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 1 });

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomW, roomD), floorMat); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomW, roomD), ceilingMat); ceiling.rotation.x = Math.PI / 2; ceiling.position.y = roomH; scene.add(ceiling);

        function createWall(w, h, x, y, z, rotY, mat) {
            const wall = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); wall.position.set(x, y, z); wall.rotation.y = rotY; wall.receiveShadow = true; scene.add(wall);
        }
        createWall(roomW, roomH, 0, roomH/2, -roomD/2, 0, wallMatLong); createWall(roomW, roomH, 0, roomH/2, roomD/2, Math.PI, wallMatLong); 
        createWall(roomD, roomH, -roomW/2, roomH/2, 0, Math.PI/2, wallMatShort); createWall(roomD, roomH, roomW/2, roomH/2, 0, -Math.PI/2, wallMatShort); 

        const centerWall = new THREE.Mesh(new THREE.BoxGeometry(11, roomH, 0.5), new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 1 })); 
        centerWall.position.set(2, roomH/2, 0); centerWall.castShadow = true; centerWall.receiveShadow = true; scene.add(centerWall);

        const mainAmbient = new THREE.AmbientLight(0xffffff, 0.8); scene.add(mainAmbient);
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.5); scene.add(hemiLight);

        const pcScreenMatOn = new THREE.MeshBasicMaterial({ color: 0x1144aa }); const pcScreenMatOff = new THREE.MeshStandardMaterial({ color: 0x010101, roughness: 1 }); 
        const pcBodyMat = new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 1 }); const deskMat = new THREE.MeshStandardMaterial({ color: 0x2a1a0a, roughness: 0.9 }); 
        const chairMatBlack = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.8 }); const chairMatRed = new THREE.MeshStandardMaterial({ color: 0xaa0000, roughness: 0.7 }); 
        const legMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });

        function buildChairMesh(chairGroup) {
            const parts = [
                new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.05, 5), chairMatBlack),
                new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.4, 8), pcBodyMat),
                new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.1, 0.45), chairMatBlack),
                new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.7, 0.1), chairMatBlack)
            ];
            parts[0].position.y = 0.025; parts[1].position.y = 0.25; parts[2].position.y = 0.5; parts[3].position.set(0, 0.9, -0.2); parts[3].rotation.x = -0.1;
            parts.forEach(p => { p.castShadow = true; p.receiveShadow = true; chairGroup.add(p); });
        }

        let interactables = []; let monitorsTurnedOff = 0; let trashCollected = 0; let currentInventory = 0; const MAX_INVENTORY = 3; let totalTrash = 0; 
        let monsterSpawned = [false, false, false]; let isBlackout = false; let hasFlashlight = false;

        // Админский стол
        const adminPCGeo = new THREE.BoxGeometry(0.6, 0.4, 0.05); const adminPC = new THREE.Mesh(adminPCGeo, new THREE.MeshBasicMaterial({ color: 0x00ff00 })); 
        adminPC.position.set(-6, 1.2, -2); adminPC.rotation.y = Math.PI/2; scene.add(adminPC);
        
        const flBody = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.25, 16), new THREE.MeshStandardMaterial({color: 0x111111}));
        flBody.rotation.set(Math.PI/2, Math.PI/4, 0); flBody.position.set(-6.2, 1.05, -2.5); flBody.userData = { isFlashlightItem: true }; flBody.visible = false; scene.add(flBody);
        
        const trashBin = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.25, 0.8, 16), new THREE.MeshStandardMaterial({ color: 0x1a441a, roughness: 0.8 })); 
        trashBin.position.set(-8.0, 0.4, -4.8); trashBin.userData = { isTrashBin: true }; trashBin.castShadow = true; interactables.push(trashBin); scene.add(trashBin);
        
        const doorMat = new THREE.MeshBasicMaterial({color: 0x440000}); 
        const exitDoor = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.5, 2), doorMat); exitDoor.position.set(-roomW/2 + 0.05, 1.25, 3.5); exitDoor.userData = { isDoor: true, isOpenable: false }; interactables.push(exitDoor); scene.add(exitDoor);

        // ВАЖНО: Настройка теней фонарика
        const playerFlashlight = new THREE.SpotLight(0xffffff, 1.8, 25, Math.PI/6, 0.6, 1);
        playerFlashlight.position.set(0.2, -0.2, 0); playerFlashlight.target.position.set(0, 0, -1); 
        playerFlashlight.castShadow = true;
        playerFlashlight.shadow.mapSize.width = 1024;
        playerFlashlight.shadow.mapSize.height = 1024;
        playerFlashlight.shadow.camera.near = 0.5;
        playerFlashlight.shadow.camera.far = 25;
        playerFlashlight.shadow.bias = -0.001;

        function createPCAndChair(x, z, rotY) {
            const group = new THREE.Group(); group.position.set(x, 0.75, z); group.rotation.y = rotY;
            const screen = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.35, 0.01), pcScreenMatOn); screen.position.set(0, 0.2, 0); screen.userData = { isOn: true, isPC: true }; interactables.push(screen); group.add(screen);
            const bezel = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.4, 0.05), pcBodyMat); bezel.position.set(0, 0.2, -0.03); bezel.castShadow=true; group.add(bezel);
            const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.06, 0.2, 8), pcBodyMat); stand.position.set(0, 0.0, -0.03); stand.castShadow=true; group.add(stand);
            
            const chairGroup = new THREE.Group(); chairGroup.position.set(0, -0.75, 0.4); chairGroup.rotation.y = Math.PI; buildChairMesh(chairGroup); group.add(chairGroup);
            
            if (Math.random() < 0.6) {
                const can = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.15, 16), new THREE.MeshStandardMaterial({ color: 0x00ff00, metalness: 0.7 }));
                can.position.set(Math.random() > 0.5 ? 0.35 : -0.35, 0.075, Math.random() * 0.2); can.userData = { isTrash: true }; can.castShadow=true; interactables.push(can); group.add(can); totalTrash++; 
            }
            scene.add(group);
        }

        function createLongTable(startX, zPos) {
            const tableGroup = new THREE.Group(); tableGroup.position.set(startX + 3.5, 0, zPos);
            const top = new THREE.Mesh(new THREE.BoxGeometry(8, 0.05, 1.4), deskMat); top.position.y = 0.75; top.castShadow = true; top.receiveShadow = true; tableGroup.add(top);
            for(let lx of [-3.9, 0, 3.9]) { const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.75, 1.3), legMat); leg.position.set(lx, 0.75/2, 0); leg.castShadow=true; tableGroup.add(leg); }
            scene.add(tableGroup);
            for (let i = 0; i < 5; i++) { createPCAndChair(startX + i * 1.7, zPos - 0.3, Math.PI); createPCAndChair(startX + i * 1.7, zPos + 0.3, 0); }
        }
        createLongTable(-1.5, -3.5); createLongTable(-1.5, 3.5);

        // Загрузка Монстров (с тенями)
        const monsters = [ { group: new THREE.Group(), active: false }, { group: new THREE.Group(), active: false }, { group: new THREE.Group(), active: false } ];
        function createFallbackMonster(index, color) {
            const group = new THREE.Group(); const mat = new THREE.MeshStandardMaterial({ color: color, emissive: 0x220000 });
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.2, 1.5, 12), mat); torso.position.y = 0.9; torso.castShadow = true; group.add(torso);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10), mat); head.position.y = 2.0; head.castShadow = true; group.add(head);
            group.visible = false; scene.add(group); monsters[index] = { group: group, active: false, speed: 1.8 + index*0.2, spawned: false, lookAwayTimer: 0 };
        }
        createFallbackMonster(0, 0xff0000); createFallbackMonster(1, 0x00ff00); createFallbackMonster(2, 0x0000ff);

        let noiseOpacity = 0; // Для визуального шума
        
        function spawnMonster(index) {
            if (monsters[index].spawned) return; monsters[index].spawned = true; monsters[index].active = true;
            const lookDir = new THREE.Vector3(); camera.getWorldDirection(lookDir); lookDir.y = 0; lookDir.normalize();
            let spawnX = Math.max(-roomW/2 + 1, Math.min(roomW/2 - 1, camera.position.x - (lookDir.x * 5)));
            let spawnZ = Math.max(-roomD/2 + 1, Math.min(roomD/2 - 1, camera.position.z - (lookDir.z * 5)));
            monsters[index].group.position.set(spawnX, 0, spawnZ); monsters[index].group.visible = true;
            playSound(monsterSpawnBuffer, 0.4);
        }

        function gameOver() {
            gameEnded = true; gameWin = false;
            if (currentPlatform === 'pc') controls.unlock(); else { blocker.style.display = 'flex'; bodycamUI.style.display = 'none'; mobileControls.style.display = 'none'; }
            blocker.style.backgroundColor = "rgba(0,0,0,1)"; startText.innerHTML = translations[currentLanguage].endLose; startText.style.color = "#ff0000"; startText.style.fontSize = "24px"; blocker.style.display = 'flex';
            playSound(deathBuffer, 0.6);
        }

        function triggerBlackout() {
            if (isBlackout) return; isBlackout = true;
            scene.remove(mainAmbient); hemiLight.intensity = 0.05; 
            flBody.visible = true; interactables.push(flBody); 
            if (blackoutBuffer) {
                const src = audioContext.createBufferSource(); src.buffer = blackoutBuffer; src.loop = true;
                const gain = audioContext.createGain(); gain.gain.value = 0.3; src.connect(gain).connect(audioContext.destination); src.start(); window.blackoutLoop = src;
            }
            updateUI();
        }

        function pickupFlashlight() {
            hasFlashlight = true; flBody.visible = false; interactables = interactables.filter(i => i !== flBody);
            camera.add(playerFlashlight); camera.add(playerFlashlight.target); uiBattery.style.display = "block";
            if (window.blackoutLoop) { window.blackoutLoop.stop(); window.blackoutLoop = null; }
            updateUI();
        }

        function updateUI() {
            const t = translations[currentLanguage]; recElement.textContent = t.rec;
            const allDone = monitorsTurnedOff >= 20 && trashCollected >= totalTrash;

            if (!isBlackout) {
                uiTime.innerHTML = t.timeOnline; uiTime.style.color = "white";
                let pcTxt = monitorsTurnedOff >= 20 ? t.taskPCDone : t.taskPC.replace('{current}', monitorsTurnedOff);
                let trashTxt = trashCollected >= totalTrash ? t.taskTrashDone.replace('{total}', totalTrash) : t.taskTrash.replace('{current}', trashCollected).replace('{total}', totalTrash);
                uiTask.innerHTML = `${t.tasks}<br>${pcTxt}<br>${trashTxt}`; uiTask.style.color = "#00ffaa";
            } else {
                if (!hasFlashlight) {
                    uiTime.innerHTML = t.timePowerFail; uiTime.style.color = "#ff0000"; uiTask.innerHTML = t.taskBlackout; uiTask.style.color = "#ff0000";
                } else {
                    uiTime.innerHTML = t.timeBackup; uiTime.style.color = "#ffaa00";
                    if (allDone) {
                        uiTask.innerHTML = t.taskComplete; uiTask.style.color = "#00ff00";
                        if (!exitDoor.userData.isOpenable) { doorMat.color.setHex(0x00ff00); exitDoor.userData.isOpenable = true; }
                    } else {
                        let pcTxt = monitorsTurnedOff >= 20 ? t.taskPCDone : t.taskPC.replace('{current}', monitorsTurnedOff);
                        let trashTxt = trashCollected >= totalTrash ? t.taskTrashDone.replace('{total}', totalTrash) : t.taskTrash.replace('{current}', trashCollected).replace('{total}', totalTrash);
                        uiTask.innerHTML = `${t.tasks}<br>${pcTxt}<br>${trashTxt}`; uiTask.style.color = "#00ffaa";
                    }
                }
            }
            if (hasFlashlight) { uiInventory.style.display="block"; uiInventory.innerHTML = t.inventory.replace('{current}', currentInventory).replace('{max}', MAX_INVENTORY); } 
            else uiInventory.style.display = "none";
            
            uiStamina.innerText = `🏃 ${Math.floor(stamina)}%`;
            uiBattery.innerText = `🔋 ${Math.floor(battery)}%`;
        }

        const raycaster = new THREE.Raycaster();
        document.addEventListener('mousedown', (e) => { if (currentPlatform === 'pc' && controls.isLocked && !gameEnded) handleInteraction(); });

        function handleInteraction() {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(interactables);
            if (intersects.length > 0) {
                const obj = intersects[0].object;
                if (!isBlackout && (obj.userData.isPC || obj.userData.isTrash)) triggerBlackout();
                if (obj.userData.isFlashlightItem) { pickupFlashlight(); playSound(pickupBuffer, 0.3); }
                if (obj.userData.isPC && obj.userData.isOn) {
                    obj.material = pcScreenMatOff; obj.userData.isOn = false; monitorsTurnedOff++; playSound(pcOffBuffer, 0.2);
                    if (monitorsTurnedOff >= 7 && !monsters[1].spawned) spawnMonster(1); updateUI();
                }
                if (obj.userData.isTrash) {
                    if (currentInventory < MAX_INVENTORY) { obj.parent.remove(obj); interactables = interactables.filter(item => item !== obj); currentInventory++; playSound(pickupBuffer, 0.2); updateUI(); }
                }
                if (obj.userData.isTrashBin && currentInventory > 0) {
                    trashCollected += currentInventory; currentInventory = 0;
                    if (trashCollected >= 4 && !monsters[0].spawned) spawnMonster(0); updateUI();
                }
                if (obj.userData.isDoor && obj.userData.isOpenable) {
                    gameEnded = true; gameWin = true;
                    if (currentPlatform === 'pc') controls.unlock(); else { blocker.style.display = 'flex'; bodycamUI.style.display = 'none'; mobileControls.style.display = 'none'; }
                    blocker.style.backgroundColor = "rgba(0,0,0,1)"; startText.innerHTML = translations[currentLanguage].endWin; startText.style.color = "#00ff00"; startText.style.fontSize = "24px"; blocker.style.display = 'flex'; playSound(doorOpenBuffer, 0.4);
                }
            }
        }

        const obstacles = [ { minX: -3.5, maxX: 7.5, minZ: -0.25, maxZ: 0.25 }, { minX: -2.0, maxX: 6.0, minZ: -4.3, maxZ: -2.7 }, { minX: -2.0, maxX: 6.0, minZ: 2.7, maxZ: 4.3 }, { minX: -6.75, maxX: -5.25, minZ: -4.0, maxZ: 0.0 }, { minX: -9.0, maxX: -6.0, minZ: -1.5, maxZ: 0.0 } ];
        function checkCollision(x, z) {
            const r = 0.3; const limitX = roomW/2 - r; const limitZ = roomD/2 - r; 
            if (x < -limitX || x > limitX || z < -limitZ || z > limitZ) return true; 
            for (let obs of obstacles) if (x > obs.minX - r && x < obs.maxX + r && z > obs.minZ - r && z < obs.maxZ + r) return true; 
            return false;
        }

        let prevTime = performance.now(); const clock = new THREE.Clock(); let stepAccum = 0; let idleTimer = 0;

        function animate() {
            requestAnimationFrame(animate);
            if ((controls.isLocked || currentPlatform === 'mobile') && !gameEnded) {
                const time = performance.now(); const delta = (time - prevTime) / 1000;
                velocity.x -= velocity.x * 10.0 * delta; velocity.z -= velocity.z * 10.0 * delta;
                direction.z = Number(moveForward) - Number(moveBackward); direction.x = Number(moveRight) - Number(moveLeft); direction.normalize();

                // Механика выносливости (Спринт)
                let isMoving = (moveForward || moveBackward || moveLeft || moveRight);
                let speed = 13.0;
                
                if (isMoving && isSprinting && stamina > 0) {
                    speed = 22.0; // Быстрее бежим
                    stamina = Math.max(0, stamina - delta * 25); // Тратим выносливость
                } else {
                    stamina = Math.min(100, stamina + delta * 15); // Восстанавливаем
                }

                // Механика батареи фонарика
                if (isBlackout && hasFlashlight) {
                    battery = Math.max(0, battery - delta * 0.5); // Медленно разряжается
                    if (battery <= 0) {
                        playerFlashlight.intensity = 0; // Фонарик садится
                    } else if (battery < 15) {
                        playerFlashlight.intensity = (Math.random() > 0.5 ? 1.8 : 0.2); // Моргает перед смертью
                    }
                }

                if (isMoving || hasFlashlight) updateUI(); // Обновляем UI счетчиков

                if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

                const oldX = camera.position.x; const oldZ = camera.position.z;

                if (currentPlatform === 'pc') { controls.moveRight(-velocity.x * delta); controls.moveForward(-velocity.z * delta); } 
                else {
                    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                    forward.y = 0; forward.normalize(); right.y = 0; right.normalize();
                    // Фикс мобильной коллизии: Сначала высчитываем новую точку, потом двигаем
                    const nextX = camera.position.x - (right.x * velocity.x * delta) - (forward.x * velocity.z * delta);
                    const nextZ = camera.position.z - (right.z * velocity.x * delta) - (forward.z * velocity.z * delta);
                    camera.position.x = nextX; camera.position.z = nextZ;
                }

                const newX = camera.position.x; const newZ = camera.position.z;
                if (checkCollision(newX, oldZ)) camera.position.x = oldX;
                if (checkCollision(oldX, newZ)) camera.position.z = oldZ;
                if (!checkCollision(newX, oldZ) && !checkCollision(oldX, newZ) && checkCollision(newX, newZ)) { camera.position.x = oldX; camera.position.z = oldZ; }
                camera.position.y = 1.7; 

                if (isMoving && velocity.length() > 0.1) {
                    stepAccum += delta; if (stepAccum > (isSprinting ? 0.25 : 0.4)) { playSound(footstepsBuffer, 0.2, 0.8 + Math.random()*0.4); stepAccum = 0; }
                    idleTimer = 0;
                } else {
                    stepAccum = 0; idleTimer += delta;
                    if (idleTimer >= 10 && !monsters[2].spawned) spawnMonster(2);
                }

                // Логика монстров
                for (let i = 0; i < monsters.length; i++) {
                    const m = monsters[i];
                    if (m.active && m.group.visible) {
                        const lookRay = new THREE.Raycaster(camera.position, camera.getWorldDirection(new THREE.Vector3()));
                        if (lookRay.intersectObjects(m.group.children, true).length > 0) { m.group.visible = false; m.lookAwayTimer = 2.0; } 
                        else {
                            const dirToPlayer = new THREE.Vector3().subVectors(camera.position, m.group.position); dirToPlayer.y = 0; const dist = dirToPlayer.length();
                            if (dist > 1.5) {
                                dirToPlayer.normalize(); m.group.position.x += dirToPlayer.x * m.speed * delta; m.group.position.z += dirToPlayer.z * m.speed * delta;
                                m.group.lookAt(camera.position.x, 0, camera.position.z);
                                if (dist < 1.6) gameOver(); // Фикс коллизии с монстром
                            }
                        }
                    } else if (m.lookAwayTimer > 0) {
                        m.lookAwayTimer -= delta;
                        if (m.lookAwayTimer <= 0) {
                            const lookDir = camera.getWorldDirection(new THREE.Vector3()); lookDir.y = 0; lookDir.normalize();
                            m.group.position.set(Math.max(-roomW/2 + 1, Math.min(roomW/2 - 1, camera.position.x - (lookDir.x * 5))), 0, Math.max(-roomD/2 + 1, Math.min(roomD/2 - 1, camera.position.z - (lookDir.z * 5))));
                            m.group.visible = true; m.lookAwayTimer = 0; playSound(monsterSpawnBuffer, 0.3);
                        }
                    }
                }
                prevTime = time;
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
