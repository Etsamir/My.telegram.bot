<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Night Shift - Real Tables</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; user-select: none; touch-action: none; }
        #blocker {
            position: absolute; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;
            font-family: 'Courier New', Courier, monospace; cursor: default; z-index: 10;
        }
        #blocker h1 { margin-bottom: 10px; letter-spacing: 4px; }
        .language-selector, .platform-selector { margin: 20px; display: flex; gap: 20px; }
        .language-selector label, .platform-selector label { cursor: pointer; padding: 5px 15px; border: 1px solid #555; border-radius: 4px; background: #222; transition: 0.3s; }
        .language-selector label.selected, .platform-selector label.selected { background: #0a4; border-color: #0f0; color: #0f0; }
        .language-selector input, .platform-selector input { display: none; }
        #start-btn {
            padding: 15px 40px; font-size: 24px; font-family: 'Courier New', monospace;
            background: #0a4; color: white; border: none; border-radius: 8px;
            cursor: pointer; box-shadow: 0 0 20px #0a4; transition: 0.3s; margin-top: 20px;
        }
        #start-btn:hover { background: #0f6; box-shadow: 0 0 30px #0f6; }
        #start-text { margin-top: 20px; font-size: 14px; color: #aaa; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background-color: rgba(255,255,255,0.8); transform: translate(-50%, -50%);
            border-radius: 50%; z-index: 5; pointer-events: none;
        }
        #bodycam-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 8; display: none;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8); 
        }
        .rec-text {
            position: absolute; top: 30px; right: 40px; color: #ff3333;
            font-family: 'Courier New', monospace; font-size: 24px; font-weight: bold;
            text-shadow: 0 0 5px red; animation: blink 1s infinite;
        }
        .time-text {
            position: absolute; top: 35px; left: 40px; color: white;
            font-family: 'Courier New', monospace; font-size: 18px; text-shadow: 0 0 3px white;
        }
        .task-text {
            position: absolute; top: 80px; left: 40px; color: #00ffaa;
            font-family: 'Courier New', monospace; font-size: 16px; text-shadow: 0 0 3px #00ffaa;
            line-height: 1.5;
        }
        .inventory-text {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); color: #ffaa00;
            font-family: 'Courier New', monospace; font-size: 20px; font-weight: bold;
            text-shadow: 0 0 5px #ffaa00; transition: color 0.3s;
        }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0;} 100% {opacity: 1;} }

        /* Мобильное управление */
        #mobile-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 20;
        }
        .move-panel {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .action-panel {
            pointer-events: auto;
        }
        .ctrl-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(50,50,50,0.8);
            border: 2px solid #0f0;
            color: #0f0;
            font-size: 30px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px #0f0;
            user-select: none;
            touch-action: none;
        }
        .ctrl-btn:active {
            background: #0f0;
            color: #000;
        }
    </style>
</head>
<body>
    <div id="blocker">
        <h1 style="text-align:center">AXON BODY 3</h1>
        
        <!-- Выбор языка -->
        <div class="language-selector">
            <label class="selected">
                <input type="radio" name="lang" value="ru" checked> Русский
            </label>
            <label>
                <input type="radio" name="lang" value="uz"> O'zbekcha
            </label>
            <label>
                <input type="radio" name="lang" value="en"> English
            </label>
        </div>

        <!-- Выбор платформы -->
        <div class="platform-selector">
            <label class="selected">
                <input type="radio" name="platform" value="pc" checked> ПК
            </label>
            <label>
                <input type="radio" name="platform" value="mobile"> Мобильный
            </label>
        </div>

        <!-- Кнопка старта -->
        <button id="start-btn">Начать смену</button>
        <p id="start-text">REAL TABLES LOADED.</p>
    </div>
    
    <div id="bodycam-ui">
        <div id="ui-time" class="time-text">03:45 AM <br> SYS: ONLINE</div>
        <div id="ui-task" class="task-text">ЗАДАЧИ:<br>[ ] Выключить ПК: 0/20<br>[ ] Выбросить мусор: 0/0</div>
        <div id="ui-inventory" class="inventory-text" style="display:none;">В РУКАХ: 0 / 3</div>
        <div class="rec-text">● REC</div>
    </div>
    <div id="crosshair"></div>

    <!-- Мобильное управление (изначально скрыто) -->
    <div id="mobile-controls" style="display: none;">
        <div class="move-panel">
            <div class="ctrl-btn" id="move-fwd">↑</div>
            <div class="ctrl-btn" id="move-left">←</div>
            <div class="ctrl-btn" id="move-back">↓</div>
            <div class="ctrl-btn" id="move-right">→</div>
        </div>
        <div class="action-panel">
            <div class="ctrl-btn" id="action-btn">E</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // ========== ПЕРЕВОДЫ ==========
        const translations = {
            ru: {
                rec: '● REC',
                timeOnline: '03:45 AM <br> SYS: ONLINE',
                timePowerFail: '03:45 AM <br> СБОЙ ПИТАНИЯ',
                timeBackup: '03:46 AM <br> РЕЗЕРВНОЕ ПИТАНИЕ',
                tasks: 'ЗАДАЧИ:',
                taskPC: '[ ] Выключить ПК: {current}/20',
                taskPCDone: '[✓] ПК выключены (20/20)',
                taskTrash: '[ ] Выбросить мусор: {current}/{total}',
                taskTrashDone: '[✓] Мусор выброшен ({total}/{total})',
                taskBlackout: 'СБОЙ ПИТАНИЯ!<br>НАЙДИТЕ ФОНАРИК НА СТОЛЕ АДМИНА!',
                taskComplete: 'СИСТЕМА СБРОШЕНА.<br>ПОКИНЬТЕ КЛУБ!',
                inventory: 'В РУКАХ: {current} / {max}',
                inventoryFull: 'ИНВЕНТАРЬ ПОЛОН! НЕСИ В БАК.',
                startBtn: 'Начать смену',
                startText: 'REAL TABLES LOADED.',
                endWin: 'СМЕНА ОКОНЧЕНА.<br>ВЫ ВЫЖИЛИ.',
                endLose: 'ВАС СХВАТИЛИ.<br>СМЕНА ПРОВАЛЕНА.',
            },
            uz: {
                rec: '● YOZILMOQDA',
                timeOnline: '03:45 AM <br> TIZIM: ISHLASH',
                timePowerFail: '03:45 AM <br> QUVVAT UZILDI',
                timeBackup: '03:46 AM <br> ZAXIRA QUVVAT',
                tasks: 'VAZIFALAR:',
                taskPC: '[ ] Kompyuterni o\'chirish: {current}/20',
                taskPCDone: '[✓] Kompyuterlar o\'chirildi (20/20)',
                taskTrash: '[ ] Axlatni tashlash: {current}/{total}',
                taskTrashDone: '[✓] Axlat tashlandi ({total}/{total})',
                taskBlackout: 'QUVVAT UZILDI!<br>ADMIN STOLIDAN CHIROQNI TOPING!',
                taskComplete: 'TIZIM TOZALANDI.<br>KLUBDAN CHIQING!',
                inventory: 'QO\'LDA: {current} / {max}',
                inventoryFull: 'INVENTAR TO\'LA! AXLAT QUTISIGA OLIB BOR.',
                startBtn: 'Smenani boshlash',
                startText: 'REAL TABLES LOADED.',
                endWin: 'SMENA TUGADI.<br>SIZ OMON QOLDINGIZ.',
                endLose: 'SIZ TUTILDINGIZ.<br>SMENA BARBOD.',
            },
            en: {
                rec: '● REC',
                timeOnline: '03:45 AM <br> SYS: ONLINE',
                timePowerFail: '03:45 AM <br> POWER FAILURE',
                timeBackup: '03:46 AM <br> BACKUP POWER',
                tasks: 'TASKS:',
                taskPC: '[ ] Turn off PCs: {current}/20',
                taskPCDone: '[✓] PCs off (20/20)',
                taskTrash: '[ ] Throw trash: {current}/{total}',
                taskTrashDone: '[✓] Trash thrown ({total}/{total})',
                taskBlackout: 'POWER FAILURE!<br>FIND FLASHLIGHT ON ADMIN DESK!',
                taskComplete: 'SYSTEM RESET.<br>LEAVE THE CLUB!',
                inventory: 'HOLDING: {current} / {max}',
                inventoryFull: 'INVENTORY FULL! TAKE TO BIN.',
                startBtn: 'Start Shift',
                startText: 'REAL TABLES LOADED.',
                endWin: 'SHIFT COMPLETE.<br>YOU SURVIVED.',
                endLose: 'YOU WERE CAUGHT.<br>SHIFT FAILED.',
            }
        };

        let currentLanguage = 'ru';
        let currentPlatform = 'pc'; // 'pc' или 'mobile'

        // Элементы интерфейса
        const langLabels = document.querySelectorAll('.language-selector label');
        const langRadios = document.querySelectorAll('input[name="lang"]');
        const platformLabels = document.querySelectorAll('.platform-selector label');
        const platformRadios = document.querySelectorAll('input[name="platform"]');
        const startBtn = document.getElementById('start-btn');
        const startText = document.getElementById('start-text');
        const blocker = document.getElementById('blocker');
        const bodycamUI = document.getElementById('bodycam-ui');
        const uiTask = document.getElementById('ui-task');
        const uiTime = document.getElementById('ui-time');
        const uiInventory = document.getElementById('ui-inventory');
        const recElement = document.querySelector('.rec-text');
        const mobileControls = document.getElementById('mobile-controls');

        function updateUILanguage() {
            const t = translations[currentLanguage];
            startBtn.textContent = t.startBtn;
            startText.textContent = t.startText;
        }

        langRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                langLabels.forEach(l => l.classList.remove('selected'));
                e.target.parentElement.classList.add('selected');
                currentLanguage = e.target.value;
                updateUILanguage();
                console.log('Язык изменён на:', currentLanguage);
            });
        });

        platformRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                platformLabels.forEach(l => l.classList.remove('selected'));
                e.target.parentElement.classList.add('selected');
                currentPlatform = e.target.value;
                console.log('Платформа изменена на:', currentPlatform);
            });
        });

        updateUILanguage();

        // ========== ЗВУКОВАЯ СИСТЕМА ==========
        let audioContext = null;
        let footstepsBuffer = null;
        let pickupBuffer = null;
        let pcOffBuffer = null;
        let blackoutBuffer = null;
        let monsterSpawnBuffer = null;
        let monsterFootstepBuffer = null;
        let doorOpenBuffer = null;
        let deathBuffer = null;

        function initAudio() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            createSounds();
            console.log('Аудио инициализировано');
        }

        function createSounds() {
            footstepsBuffer = createNoiseBuffer(0.2, 0.1, 200);
            pickupBuffer = createToneBuffer(0.15, 600, 'sine');
            pcOffBuffer = createToneBuffer(0.2, 100, 'sawtooth');
            blackoutBuffer = createNoiseBuffer(1.5, 0.3, 60);
            monsterSpawnBuffer = createNoiseBuffer(0.8, 0.2, 80);
            monsterFootstepBuffer = createToneBuffer(0.3, 60, 'triangle');
            doorOpenBuffer = createToneBuffer(0.5, 400, 'sine', 0.3);
            deathBuffer = createNoiseBuffer(1.0, 0.5, 150);
        }

        function createNoiseBuffer(duration, volume, lowpassFreq) {
            if (!audioContext) return null;
            const sampleRate = audioContext.sampleRate;
            const buffer = audioContext.createBuffer(1, sampleRate * duration, sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < buffer.length; i++) {
                data[i] = (Math.random() * 2 - 1) * volume;
            }
            if (lowpassFreq > 0) {
                const k = Math.exp(-2 * Math.PI * lowpassFreq / sampleRate);
                let prev = 0;
                for (let i = 0; i < buffer.length; i++) {
                    data[i] = prev + (data[i] - prev) * (1 - k);
                    prev = data[i];
                }
            }
            return buffer;
        }

        function createToneBuffer(duration, frequency, type = 'sine', volume = 0.3) {
            if (!audioContext) return null;
            const sampleRate = audioContext.sampleRate;
            const buffer = audioContext.createBuffer(1, sampleRate * duration, sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < buffer.length; i++) {
                data[i] = Math.sin(2 * Math.PI * frequency * i / sampleRate) * volume * (1 - i / buffer.length);
            }
            return buffer;
        }

        function playSound(buffer, volume = 0.5, pitch = 1.0) {
            if (!audioContext || !buffer) return;
            if (audioContext.state === 'suspended') audioContext.resume();
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.playbackRate.value = pitch;
            const gainNode = audioContext.createGain();
            gainNode.gain.value = volume;
            source.connect(gainNode).connect(audioContext.destination);
            source.start();
        }

        // Шаги игрока
        let stepTimer = 0;
        function playFootstep() {
            if (gameEnded) return;
            playSound(footstepsBuffer, 0.2, 0.8 + Math.random()*0.4);
        }

        // ========== ИГРОВАЯ ЛОГИКА ==========
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0a0a, 0.06); 

        const camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Для мобильного управления мы не используем PointerLockControls, а обрабатываем касания вручную
        let controls;
        if (currentPlatform === 'pc') {
            controls = new THREE.PointerLockControls(camera, document.body);
        } else {
            // Заглушка
            controls = { isLocked: true, lock: () => {}, unlock: () => {} };
        }

        let gameEnded = false;
        let gameWin = false;

        // Флаг, чтобы обработчики мобильных кнопок добавлялись только один раз
        let mobileControlsInitialized = false;

        startBtn.addEventListener('click', () => {
            console.log('Старт нажата, платформа:', currentPlatform);
            initAudio();
            if (currentPlatform === 'pc') {
                if (!gameEnded) controls.lock();
            } else {
                startMobileGame();
            }
        });

        function startMobileGame() {
            console.log('Запуск мобильной игры');
            blocker.style.display = 'none';
            bodycamUI.style.display = 'block';
            mobileControls.style.display = 'flex';
            // Устанавливаем камеру в нужную позицию
            camera.position.set(-4.5, 1.7, 2);
            // Захватываем касания для поворота камеры
            setupMobileControls();
            updateUI();
        }

        if (currentPlatform === 'pc') {
            controls.addEventListener('lock', () => { 
                console.log('Блокировка мыши');
                blocker.style.display = 'none'; 
                bodycamUI.style.display = 'block'; 
                updateUI(); 
            });

            controls.addEventListener('unlock', () => { 
                if (!gameEnded) { 
                    blocker.style.display = 'flex'; 
                    bodycamUI.style.display = 'none'; 
                } 
            });
        }

        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;

        document.addEventListener('keydown', (e) => {
            if (currentPlatform !== 'pc') return;
            if(e.code === 'KeyW') moveForward = true; if(e.code === 'KeyA') moveLeft = true;
            if(e.code === 'KeyS') moveBackward = true; if(e.code === 'KeyD') moveRight = true;
        });
        document.addEventListener('keyup', (e) => {
            if (currentPlatform !== 'pc') return;
            if(e.code === 'KeyW') moveForward = false; if(e.code === 'KeyA') moveLeft = false;
            if(e.code === 'KeyS') moveBackward = false; if(e.code === 'KeyD') moveRight = false;
        });

        // Мобильное управление кнопками
        const moveFwd = document.getElementById('move-fwd');
        const moveLeftBtn = document.getElementById('move-left');
        const moveBack = document.getElementById('move-back');
        const moveRightBtn = document.getElementById('move-right');
        const actionBtn = document.getElementById('action-btn');

        function setupMobileControls() {
            if (mobileControlsInitialized) return;
            mobileControlsInitialized = true;

            moveFwd.addEventListener('touchstart', (e) => { e.preventDefault(); moveForward = true; });
            moveFwd.addEventListener('touchend', (e) => { e.preventDefault(); moveForward = false; });
            moveBack.addEventListener('touchstart', (e) => { e.preventDefault(); moveBackward = true; });
            moveBack.addEventListener('touchend', (e) => { e.preventDefault(); moveBackward = false; });
            moveLeftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft = true; });
            moveLeftBtn.addEventListener('touchend', (e) => { e.preventDefault(); moveLeft = false; });
            moveRightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); moveRight = true; });
            moveRightBtn.addEventListener('touchend', (e) => { e.preventDefault(); moveRight = false; });
            
            actionBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!gameEnded) {
                    handleInteraction();
                }
            });
            console.log('Мобильные кнопки инициализированы');
        }

        // Поворот камеры на мобильных через перетаскивание
        let lastTouchX = 0, lastTouchY = 0;
        let pitch = 0, yaw = 0;
        const PI_2 = Math.PI / 2;

        document.addEventListener('touchstart', (e) => {
            if (currentPlatform !== 'mobile' || gameEnded || blocker.style.display !== 'none') return;
            const touch = e.touches[0];
            lastTouchX = touch.clientX;
            lastTouchY = touch.clientY;
        });

        document.addEventListener('touchmove', (e) => {
            if (currentPlatform !== 'mobile' || gameEnded || blocker.style.display !== 'none') return;
            e.preventDefault();
            const touch = e.touches[0];
            const deltaX = touch.clientX - lastTouchX;
            const deltaY = touch.clientY - lastTouchY;

            yaw -= deltaX * 0.005;
            pitch -= deltaY * 0.005;
            pitch = Math.max(-PI_2 + 0.1, Math.min(PI_2 - 0.1, pitch));

            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            lastTouchX = touch.clientX;
            lastTouchY = touch.clientY;
        });

        // ========== ГЕОМЕТРИЯ КОМНАТЫ ==========
        function createTileTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256; const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#080808'; ctx.fillRect(0,0,256,256);
            ctx.strokeStyle = '#151515'; ctx.lineWidth = 4; ctx.strokeRect(0,0,256,256);
            const tex = new THREE.CanvasTexture(canvas); tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(18, 12); return tex;
        }

        function createWallTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 256; const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#111111'; ctx.fillRect(0,0,128,256); ctx.fillStyle = '#151515'; ctx.fillRect(0,0,64,256); 
            const tex = new THREE.CanvasTexture(canvas); tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; return tex;
        }

        const roomW = 18, roomD = 12, roomH = 3.8; 
        const floorTex = createTileTexture(); const wallTex = createWallTexture(); wallTex.repeat.set(roomW/2, 1); const wallTexShort = createWallTexture(); wallTexShort.repeat.set(roomD/2, 1);
        const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.7 }); const wallMatLong = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 1 });
        const wallMatShort = new THREE.MeshStandardMaterial({ map: wallTexShort, roughness: 1 }); const ceilingMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 1 });

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(roomW, roomD), floorMat); floor.rotation.x = -Math.PI / 2; scene.add(floor);
        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(roomW, roomD), ceilingMat); ceiling.rotation.x = Math.PI / 2; ceiling.position.y = roomH; scene.add(ceiling);

        function createWall(w, h, x, y, z, rotY, mat) {
            const wall = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); wall.position.set(x, y, z); wall.rotation.y = rotY; scene.add(wall);
        }
        createWall(roomW, roomH, 0, roomH/2, -roomD/2, 0, wallMatLong); createWall(roomW, roomH, 0, roomH/2, roomD/2, Math.PI, wallMatLong); 
        createWall(roomD, roomH, -roomW/2, roomH/2, 0, Math.PI/2, wallMatShort); createWall(roomD, roomH, roomW/2, roomH/2, 0, -Math.PI/2, wallMatShort); 

        const columnMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
        function addColumn(x, z) { const col = new THREE.Mesh(new THREE.BoxGeometry(0.6, roomH, 0.6), columnMat); col.position.set(x, roomH/2, z); scene.add(col); }
        addColumn(-8.8, -5.8); addColumn(8.8, -5.8); addColumn(-8.8, 5.8); addColumn(8.8, 5.8); addColumn(0, -5.8); addColumn(0, 5.8); 

        const centerWallMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 1 });
        const centerWall = new THREE.Mesh(new THREE.BoxGeometry(11, roomH, 0.5), centerWallMat); centerWall.position.set(2, roomH/2, 0); scene.add(centerWall);

        const mainAmbient = new THREE.AmbientLight(0xffffff, 0.8); scene.add(mainAmbient);
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.5); scene.add(hemiLight);

        const ledTopMat = new THREE.MeshBasicMaterial({ color: 0x5555ff }); const ledBotMat = new THREE.MeshBasicMaterial({ color: 0x00ffff }); 
        function createLedStrip(w, d, x, y, z, material) { const strip = new THREE.Mesh(new THREE.BoxGeometry(w, 0.05, d), material); strip.position.set(x, y, z); scene.add(strip); }

        function checkCollision(x, z) {
            const r = 0.3; 
            const limitX = roomW/2 - r; const limitZ = roomD/2 - r; 
            if (x < -limitX || x > limitX || z < -limitZ || z > limitZ) return true; 

            for (let obs of obstacles) {

        let prevTime = performance.now(); const clock = new THREE.Clock(); 
        let stepAccum = 0;

        function animate() {
            requestAnimationFrame(animate);

            if ((controls.isLocked || currentPlatform === 'mobile') && !gameEnded) {
                const time = performance.now(); const delta = (time - prevTime) / 1000;
                velocity.x -= velocity.x * 10.0 * delta; velocity.z -= velocity.z * 10.0 * delta;
                direction.z = Number(moveForward) - Number(moveBackward); direction.x = Number(moveRight) - Number(moveLeft); direction.normalize();

                const speed = 13.0; 
                if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

                const oldX = camera.position.x;
                const oldZ = camera.position.z;

                // Для мобильных двигаем камеру напрямую, для ПК через controls
                if (currentPlatform === 'pc') {
                    controls.moveRight(-velocity.x * delta); 
                    controls.moveForward(-velocity.z * delta);
                } else {
                    // Движение в направлении взгляда
                    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                    forward.y = 0; forward.normalize();
                    right.y = 0; right.normalize();
                    camera.position.addScaledVector(forward, -velocity.z * delta);
                    camera.position.addScaledVector(right, -velocity.x * delta);
                }

                const newX = camera.position.x;
                const newZ = camera.position.z;

                let colX = checkCollision(newX, oldZ);
                let colZ = checkCollision(oldX, newZ);
                let colBoth = checkCollision(newX, newZ);

                if (colX) camera.position.x = oldX;
                if (colZ) camera.position.z = oldZ;
                if (!colX && !colZ && colBoth) {
                    camera.position.x = oldX;
                    camera.position.z = oldZ;
                }

                camera.position.y = 1.7; 

                // Шаги игрока
                if ((moveForward || moveBackward || moveLeft || moveRight) && (velocity.length() > 0.1)) {
                    stepAccum += delta;
                    if (stepAccum > 0.4) {
                        playFootstep();
                        stepAccum = 0;
                    }
                } else {
                    stepAccum = 0;
                }

                // RGB лента
                if (!isBlackout) {
                    const elapsedTime = clock.getElapsedTime();
                    const r = Math.sin(elapsedTime * 0.5) * 0.5 + 0.5;
                    const g = Math.sin(elapsedTime * 0.5 + Math.PI/2) * 0.5 + 0.5;
                    const b = Math.sin(elapsedTime * 0.5 + Math.PI) * 0.5 + 0.5;
                    rgbLedStripMat.color.setRGB(r, g, b);
                } else if (isBlackout && hasFlashlight) {
                    const elapsedTime = clock.getElapsedTime();
                    const flicker = Math.sin(elapsedTime * 20) * 0.2 + 0.8;
                    playerFlashlight.intensity = 1.6 * flicker;
                }

                // Логика монстра
                if (monsterActive && monsterGroup.visible) {
                    const time = clock.getElapsedTime();
                    monsterGroup.position.y = Math.sin(time * 3) * 0.05;
                    
                    const lookRay = new THREE.Raycaster(camera.position, camera.getWorldDirection(new THREE.Vector3()));
                    const monsterParts = monsterGroup.children;
                    const intersectsLook = lookRay.intersectObjects(monsterParts, true);
                    if (intersectsLook.length > 0) {
                        monsterGroup.visible = false;
                        monsterLookAwayTimer = 2.0;
                    } else {
                        const directionToPlayer = new THREE.Vector3().subVectors(camera.position, monsterGroup.position);
                        directionToPlayer.y = 0;
                        const distance = directionToPlayer.length();
                        if (distance > 1.5) {
                            directionToPlayer.normalize();
                            monsterGroup.position.x += directionToPlayer.x * monsterSpeed * delta;
                            monsterGroup.position.z += directionToPlayer.z * monsterSpeed * delta;
                            monsterGroup.lookAt(camera.position.x, 0, camera.position.z);
                            
                            if (Math.random() < delta * 2) {
                                playSound(monsterFootstepBuffer, 0.15, 0.7 + Math.random()*0.3);
                            }
                        }
                        noiseOpacity = Math.min(0.7, 0.3 + 0.4 * (1 - Math.min(1, distance / 5)));
                    }
                } else if (monsterLookAwayTimer > 0) {
                    monsterLookAwayTimer -= delta;
                    if (monsterLookAwayTimer <= 0) {
                        const lookDir = camera.getWorldDirection(new THREE.Vector3());
                        lookDir.y = 0; lookDir.normalize();
                        let spawnX = camera.position.x - (lookDir.x * 5);
                        let spawnZ = camera.position.z - (lookDir.z * 5);
                        spawnX = Math.max(-roomW/2 + 1, Math.min(roomW/2 - 1, spawnX));
                        spawnZ = Math.max(-roomD/2 + 1, Math.min(roomD/2 - 1, spawnZ));
                        monsterGroup.position.set(spawnX, 0, spawnZ);
                        monsterGroup.visible = true;
                        monsterLookAwayTimer = 0;
                        playSound(monsterSpawnBuffer, 0.3);
                    }
                }

                if (checkMonsterCollision()) {
                    gameOver();
                }

                prevTime = time;
            }
            if (mixer) mixer.update(clock.getDelta());
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
