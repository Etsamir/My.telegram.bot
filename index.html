<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Bot Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
            --accent-gold: #ffcc00;
            --btn-bg: #121212;
            --border-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header section */
        .header {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 25px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, #333, #666);
            border-radius: 50%;
            margin-right: 15px;
        }

        .user-info h2 {
            margin: 0;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .user-info p {
            margin: 0;
            color: #888;
            font-size: 14px;
        }

        /* Balance Card */
        .balance-card {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            width: 90%;
            position: relative;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .currency-switch {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #000;
            border-radius: 8px;
            display: flex;
            padding: 2px;
            border: 1px solid var(--border-color);
        }

        .currency-switch span {
            padding: 4px 8px;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .currency-switch .active {
            background: #333;
            border-radius: 6px;
        }

        .balance-amount {
            font-size: 42px;
            font-weight: 800;
            margin: 10px 0 25px 0;
            display: flex;
            align-items: center;
        }

        .balance-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--btn-bg);
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        /* Grid Menu */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .menu-item {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border: 1px solid var(--border-color);
            position: relative;
            text-decoration: none;
            color: white;
        }

        .menu-item i {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            color: var(--accent-gold);
        }

        .menu-item span {
            font-weight: 800;
            text-transform: uppercase;
            font-size: 18px;
            letter-spacing: 1px;
        }

        /* Loader */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="loader">Yuklanmoqda...</div>

    <div class="header">
        <div class="avatar" id="user-photo"></div>
        <div class="user-info">
            <h2 id="user-name">NAME</h2>
            <p id="user-id">12345678</p>
        </div>
    </div>

    <div class="balance-card">
        <div class="currency-switch">
            <span class="active">USD</span>
            <span>UZS</span>
        </div>
        <div class="balance-amount">
            $ <span id="balance">0.00</span>
        </div>
        <div class="balance-buttons">
            <button class="btn" onclick="tg.showAlert('Tez orada...')">Пополнить</button>
            <button class="btn" onclick="tg.showAlert('Tez orada...')">Вывести</button>
        </div>
    </div>

    <div class="menu-grid">
        <div class="menu-item" onclick="openSection('game')">
            <i class="fas fa-puzzle-piece"></i>
            <span>Game</span>
        </div>
        <div class="menu-item" onclick="openSection('tour')">
            <i class="fas fa-trophy"></i>
            <span>Tour</span>
        </div>
        <div class="menu-item" onclick="openSection('code')">
            <i class="fas fa-key"></i>
            <span>Code</span>
        </div>
        <div class="menu-item" onclick="openSection('boss')">
            <i class="fas fa-crown"></i>
            <span>Boss</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // API URL (O'zingizning serveringiz manzilini yozing)
        const API_BASE_URL = "https://serveringiz.com"; // Flask ishlayotgan URL

        async function loadUserData() {
            try {
                // Telegramdan foydalanuvchi ma'lumotlarini olish
                const user = tg.initDataUnsafe.user;
                if (user) {
                    document.getElementById('user-name').innerText = user.first_name.toUpperCase();
                    document.getElementById('user-id').innerText = user.id;
                }

                // Serverdan haqiqiy balansni olish
                const response = await fetch(`${API_BASE_URL}/api/user`, {
                    headers: {
                        'X-Telegram-Init-Data': tg.initData
                    }
                });
                const data = await response.json();
                
                if (data.balance !== undefined) {
                    document.getElementById('balance').innerText = data.balance.toFixed(2);
                }
            } catch (e) {
                console.error("Xatolik:", e);
                // Test uchun xatolik bo'lsa ham loaderni yopamiz
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        function openSection(name) {
            tg.HapticFeedback.impactOccurred('medium');
            tg.showAlert(name.toUpperCase() + " bo'limi tez orada ishga tushadi!");
        }

        // Sahifa yuklanganda ishga tushadi
        window.onload = loadUserData;
    </script>
</body>
</html>
