<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Night Shift - Bodycam Horror</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
        
        /* ================= СТРАШНОЕ МЕНЮ (VHS / BODYCAM) ================= */
        #blocker {
            position: absolute; width: 100%; height: 100%; 
            background: #000; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            font-family: 'Courier New', Courier, monospace; cursor: default; z-index: 10;
        }

        .menu-container {
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #333;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 1), 0 0 20px rgba(0,0,0,1);
            padding: 40px;
            border-radius: 4px;
            max-width: 500px;
            width: 85%;
            position: relative;
        }

        .menu-container::before {
            content: " "; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px; pointer-events: none; opacity: 0.6;
        }

        .menu-title {
            color: #ddd; font-size: 34px; margin: 0 0 30px 0; letter-spacing: 8px; 
            text-align: center; 
            text-shadow: 2px 0px 1px rgba(255,0,0,0.8), -2px 0px 1px rgba(0,0,255,0.8);
            border-bottom: 1px solid #333; padding-bottom: 15px;
            font-weight: bold;
        }

        .settings-group { margin-bottom: 25px; position: relative; z-index: 1; }
        
        .settings-title {
            font-size: 12px; color: #777; margin-bottom: 10px; 
            text-transform: uppercase; letter-spacing: 3px; font-weight: bold;
        }

        .settings-row { display: flex; gap: 6px; flex-wrap: wrap; }
        
        .settings-row label { 
            cursor: pointer; padding: 12px 0; border: 1px solid #222; border-radius: 2px; 
            background: #050505; transition: all 0.2s ease; font-size: 14px; color: #666; 
            flex: 1; text-align: center; min-width: 30%; font-weight: bold;
        }
        .settings-row label:hover { background: #111; color: #999; }
        .settings-row label.selected { 
            background: #eee; color: #000; border-color: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }
        .settings-row input { display: none; }
        
        #start-btn {
            position: relative; z-index: 1;
            margin-top: 15px; padding: 15px; font-size: 24px; font-family: 'Courier New', monospace;
            background: #300; color: #f55; border: 1px solid #600; border-radius: 2px;
            cursor: pointer; transition: 0.2s; width: 100%; font-weight: bold;
            letter-spacing: 4px; text-transform: uppercase;
        }
        #start-btn:hover { background: #800; color: #fff; border-color: #f00; box-shadow: 0 0 15px rgba(255, 0, 0, 0.4); }
        
        #start-text { 
            position: relative; z-index: 1; margin-top: 20px; font-size: 13px; color: #555; 
            text-align: center; line-height: 1.6;
        }

        #restart-btn {
            position: relative; z-index: 1; margin-top: 15px; padding: 15px; font-size: 20px; 
            font-family: 'Courier New', monospace; background: #222; color: #fff; border: 1px solid #777; 
            border-radius: 2px; cursor: pointer; transition: 0.2s; width: 100%; font-weight: bold;
            letter-spacing: 4px; text-transform: uppercase;
        }
        #restart-btn:hover { background: #eee; color: #000; box-shadow: 0 0 15px rgba(255, 255, 255, 0.6); }

        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
            background-color: rgba(255,255,255,0.6); transform: translate(-50%, -50%);
            border-radius: 50%; z-index: 5; pointer-events: none;
        }
        
        #bodycam-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 8; display: none;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9); transition: box-shadow 0.2s;
        }
        .rec-text {
            position: absolute; top: 30px; right: 40px; color: #ff3333;
            font-family: 'Courier New', monospace; font-size: 24px; font-weight: bold;
            text-shadow: 0 0 5px red; animation: blink 1s infinite;
        }
        .time-text {
            position: absolute; top: 35px; left: 40px; color: #ddd;
            font-family: 'Courier New', monospace; font-size: 18px; line-height: 1.3;
        }
        .task-text {
            position: absolute; top: 85px; left: 40px; color: #ccc;
            font-family: 'Courier New', monospace; font-size: 16px; line-height: 1.5;
        }
        .stats-text {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #ccc;
            font-family: 'Courier New', monospace; font-size: 18px; font-weight: bold;
            width: 100%; text-align: center; letter-spacing: 2px;
        }
        .inventory-text {
            position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); color: #aaa;
            font-family: 'Courier New', monospace; font-size: 20px; font-weight: bold;
            width: 100%; text-align: center; transition: color 0.3s;
        }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0;} 100% {opacity: 1;} }

        /* МОБИЛЬНЫЕ КНОПКИ */
        #mobile-controls {
            position: absolute; bottom: 30px; right: 20px;
            display: flex; flex-direction: column; gap: 15px;
            z-index: 20; pointer-events: none;
        }
        .action-panel { pointer-events: auto; display: flex; flex-direction: column; gap: 15px; align-items: flex-end; }
        .ctrl-btn {
            width: 65px; height: 65px; border-radius: 50%;
            background: rgba(20,20,20,0.6); border: 2px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.7);
            font-size: 28px; font-weight: bold; display: flex; align-items: center; justify-content: center;
            user-select: none; touch-action: none; transition: 0.1s;
        }
        .ctrl-btn:active { background: rgba(255,255,255,0.8); color: #000; border-color: #fff; }
        
        #sprint-btn { font-size: 22px; }
        .sprint-active { background: rgba(200,50,50,0.8) !important; color: #fff !important; border-color: #ff3333 !important; }

        /* Джойстик */
        #joystick-base {
            position: absolute; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%; display: none; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 25;
        }
        #joystick-stick {
            position: absolute; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.4); border-radius: 50%;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            pointer-events: none; 
        }
        
        @media (min-width: 768px) {
            .ctrl-btn { width: 70px; height: 70px; font-size: 30px; }
        }
    </style>
</head>
<body>
    <div id="blocker">
        <div class="menu-container" id="main-menu">
            <h1 class="menu-title">AXON BODY 3</h1>
            
            <div class="settings-group">
                <div class="settings-title" id="lbl-lang">System Language</div>
                <div class="settings-row language-selector">
                    <label class="selected"><input type="radio" name="lang" value="ru" checked> RU</label>
                    <label><input type="radio" name="lang" value="uz"> UZ</label>
                    <label><input type="radio" name="lang" value="en"> EN</label>
                </div>
            </div>
            
            <div class="settings-group">
                <div class="settings-title" id="lbl-platform">Device Platform</div>
                <div class="settings-row platform-selector">
                    <label class="selected"><input type="radio" name="platform" value="pc" checked> PC</label>
                    <label><input type="radio" name="platform" value="mobile"> MOBILE</label>
                </div>
            </div>

            <div class="settings-group">
                <div class="settings-title" id="lbl-diff">Threat Level</div>
                <div class="settings-row difficulty-selector">
                    <label><input type="radio" name="difficulty" value="easy"> <span id="diff-easy">0%</span></label>
                    <label class="selected"><input type="radio" name="difficulty" value="medium" checked> <span id="diff-medium">50%</span></label>
                    <label><input type="radio" name="difficulty" value="hard"> <span id="diff-hard">100%</span></label>
                </div>
            </div>

            <div class="settings-group">
                <div class="settings-title" id="lbl-gfx">Video Graphics</div>
                <div class="settings-row graphics-selector">
                    <label><input type="radio" name="graphics" value="low"> <span id="gfx-low">LOW</span></label>
                    <label><input type="radio" name="graphics" value="medium"> <span id="gfx-medium">MID</span></label>
                    <label class="selected"><input type="radio" name="graphics" value="high" checked> <span id="gfx-high">MAX</span></label>
                </div>
            </div>

            <button id="start-btn">INITIATE REC</button>
            <div id="start-text">SYSTEM READY. AWAITING OPERATOR.</div>
        </div>

        <div class="menu-container" id="game-over-menu" style="display: none; text-align: center;">
            <h1 class="menu-title" id="game-over-title" style="border: none;">TITLE</h1>
            <p id="game-over-desc" style="color: #aaa; font-size: 16px; margin-bottom: 30px; letter-spacing: 2px;">DESC</p>
            <button id="restart-btn">RESTART SHIFT</button>
        </div>
    </div>
    
    <div id="bodycam-ui">
        <div id="ui-time" class="time-text">--:--:-- <br> SYS: ONLINE</div>
        <div id="ui-task" class="task-text">ЗАДАЧИ:<br>[ ] Выключить ПК: 0/20<br>[ ] Выбросить мусор: 0/0</div>
        <div id="ui-inventory" class="inventory-text" style="display:none;">В РУКАХ: 0 / 3</div>
        <div id="ui-stats" class="stats-text">HP: 100% | STM: 100%</div>
        <div class="rec-text">● REC</div>
        <div id="joystick-base"><div id="joystick-stick"></div></div>
    </div>
    <div id="crosshair"></div>

    <div id="mobile-controls" style="display: none;">
        <div class="action-panel">
            <div class="ctrl-btn" id="sprint-btn">🏃</div>
            <div class="ctrl-btn" id="action-btn">E</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        const translations = {
            ru: { 
                sysOnline: 'SYS: ONLINE', powerFail: 'СБОЙ ПИТАНИЯ', backupPower: 'РЕЗЕРВНОЕ ПИТАНИЕ',
                tasks: 'ЗАДАЧИ:', taskPC: '[ ] Выключить ПК: {current}/20', taskPCDone: '[✓] ПК выключены (20/20)', 
                taskTrash: '[ ] Выбросить мусор: {current}/{total}', taskTrashDone: '[✓] Мусор выброшен ({total}/{total})', 
                taskBlackout: 'СБОЙ ПИТАНИЯ!<br>НАЙДИТЕ ФОНАРИК НА СТОЛЕ АДМИНА!', taskComplete: 'СИСТЕМА СБРОШЕНА.<br>ПОКИНЬТЕ КЛУБ!', 
                stats: 'HP: {hp}% | STM: {stm}%', inventory: 'В РУКАХ: {current} / {max}', inventoryFull: 'ИНВЕНТАРЬ ПОЛОН! НЕСИ В БАК.', 
                startBtn: 'Начать запись', startText: 'Смена началась. Следите за клиентами и убирайте мусор.<br>Shift - Бег. E - Взаимодействие.', 
                winTitle: 'СМЕНА ОКОНЧЕНА', winDesc: 'ВЫ УСПЕШНО ВЫЖИЛИ.', 
                loseTitle: 'СВЯЗЬ ПОТЕРЯНА', loseDesc: 'ЖИЗНЕННЫЕ ПОКАЗАТЕЛИ: 0', restartBtn: 'ПОВТОРИТЬ СМЕНУ',
                diffEasy: 'Мирная', diffMedium: 'Средняя', diffHard: 'Кошмар',
                gfxLow: 'Мин', gfxMedium: 'Сред', gfxHigh: 'Макс',
                lblLang: 'ЯЗЫК СИСТЕМЫ', lblPlatform: 'ПЛАТФОРМА', lblDiff: 'УРОВЕНЬ УГРОЗЫ', lblGfx: 'КАЧЕСТВО ВИДЕО', rec: '● REC'
            },
            uz: { 
                sysOnline: 'TIZIM: ISHLASH', powerFail: 'QUVVAT UZILDI', backupPower: 'ZAXIRA QUVVAT',
                tasks: 'VAZIFALAR:', taskPC: '[ ] Kompyuterni o\'chirish: {current}/20', taskPCDone: '[✓] Kompyuterlar o\'chirildi (20/20)', 
                taskTrash: '[ ] Axlatni tashlash: {current}/{total}', taskTrashDone: '[✓] Axlat tashlandi ({total}/{total})', 
                taskBlackout: 'QUVVAT UZILDI!<br>ADMIN STOLIDAN CHIROQNI TOPING!', taskComplete: 'TIZIM TOZALANDI.<br>KLUBDAN CHIQING!', 
                stats: 'JON: {hp}% | QUVVAT: {stm}%', inventory: 'QO\'LDA: {current} / {max}', inventoryFull: 'INVENTAR TO\'LA! AXLAT QUTISIGA OLIB BOR.', 
                startBtn: 'Yozishni boshlash', startText: 'Smena boshlandi. Ehtiyot bo\'ling.<br>Chap tomon - Yuris. O\'ng - Qarash.', 
                winTitle: 'SMENA TUGADI', winDesc: 'SIZ OMON QOLDINGIZ.', 
                loseTitle: 'ALOQA UZILDI', loseDesc: 'HAYOTIY KO\'RSATKICHLAR: 0', restartBtn: 'SMENANI QAYTA BOSHLASH',
                diffEasy: 'Tinch', diffMedium: "O'rta", diffHard: 'Dahshat',
                gfxLow: 'Past', gfxMedium: 'O\'rta', gfxHigh: 'Yuqori',
                lblLang: 'TIZIM TILI', lblPlatform: 'QURILMA', lblDiff: 'XAVF DARAJASI', lblGfx: 'VIDEO SIFATI', rec: '● REC'
            },
            en: { 
                sysOnline: 'SYS: ONLINE', powerFail: 'POWER FAILURE', backupPower: 'BACKUP POWER',
                tasks: 'TASKS:', taskPC: '[ ] Turn off PCs: {current}/20', taskPCDone: '[✓] PCs off (20/20)', 
                taskTrash: '[ ] Throw trash: {current}/{total}', taskTrashDone: '[✓] Trash thrown ({total}/{total})', 
                taskBlackout: 'POWER FAILURE!<br>FIND FLASHLIGHT ON ADMIN DESK!', taskComplete: 'SYSTEM RESET.<br>LEAVE THE CLUB!', 
                stats: 'HP: {hp}% | STM: {stm}%', inventory: 'HOLDING: {current} / {max}', inventoryFull: 'INVENTORY FULL! TAKE TO BIN.', 
                startBtn: 'INITIATE REC', startText: 'Shift started. Stay alert.<br>Shift to Sprint. E to Interact.', 
                winTitle: 'SHIFT COMPLETE', winDesc: 'YOU SURVIVED.', 
                loseTitle: 'CONNECTION LOST', loseDesc: 'VITALS: 0', restartBtn: 'RESTART SHIFT',
                diffEasy: 'Safe', diffMedium: 'Normal', diffHard: 'Nightmare',
                gfxLow: 'Low', gfxMedium: 'Med', gfxHigh: 'High',
                lblLang: 'SYSTEM LANGUAGE', lblPlatform: 'DEVICE PLATFORM', lblDiff: 'THREAT LEVEL', lblGfx: 'VIDEO GRAPHICS', rec: '● REC'
            }
        };

        let currentLanguage = 'ru'; 
        let currentPlatform = 'pc';
        let currentDifficulty = 'medium';
        let currentGraphics = 'high';

        const langLabels = document.querySelectorAll('.language-selector label'); const langRadios = document.querySelectorAll('input[name="lang"]'); 
        const platformLabels = document.querySelectorAll('.platform-selector label'); const platformRadios = document.querySelectorAll('input[name="platform"]'); 
        const diffLabels = document.querySelectorAll('.difficulty-selector label'); const diffRadios = document.querySelectorAll('input[name="difficulty"]'); 
        const gfxLabels = document.querySelectorAll('.graphics-selector label'); const gfxRadios = document.querySelectorAll('input[name="graphics"]'); 
        
        const startBtn = document.getElementById('start-btn'); const startText = document.getElementById('start-text'); 
        const restartBtn = document.getElementById('restart-btn');
        const blocker = document.getElementById('blocker'); const bodycamUI = document.getElementById('bodycam-ui'); 
        const uiTask = document.getElementById('ui-task'); const uiTime = document.getElementById('ui-time'); 
        const uiStats = document.getElementById('ui-stats'); const uiInventory = document.getElementById('ui-inventory'); 
        const recElement = document.querySelector('.rec-text'); const mobileControls = document.getElementById('mobile-controls'); 
        const sprintBtn = document.getElementById('sprint-btn'); const actionBtn = document.getElementById('action-btn');

        function updateUILanguage() { 
            const t = translations[currentLanguage]; 
            startBtn.textContent = t.startBtn; 
            startText.innerHTML = t.startText; 
            restartBtn.textContent = t.restartBtn;
            document.getElementById('diff-easy').textContent = t.diffEasy;
            document.getElementById('diff-medium').textContent = t.diffMedium;
            document.getElementById('diff-hard').textContent = t.diffHard;
            document.getElementById('gfx-low').textContent = t.gfxLow;
            document.getElementById('gfx-medium').textContent = t.gfxMedium;
            document.getElementById('gfx-high').textContent = t.gfxHigh;
            
            document.getElementById('lbl-lang').textContent = t.lblLang;
            document.getElementById('lbl-platform').textContent = t.lblPlatform;
            document.getElementById('lbl-diff').textContent = t.lblDiff;
            document.getElementById('lbl-gfx').textContent = t.lblGfx;
        }

        function setupRadioButtons(radios, labels, callback) {
            radios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    labels.forEach(l => l.classList.remove('selected'));
                    e.target.parentElement.classList.add('selected');
                    callback(e.target.value);
                });
            });
        }

        setupRadioButtons(langRadios, langLabels, (val) => { currentLanguage = val; updateUILanguage(); });
        setupRadioButtons(platformRadios, platformLabels, (val) => { currentPlatform = val; });
        setupRadioButtons(diffRadios, diffLabels, (val) => { currentDifficulty = val; });
        setupRadioButtons(gfxRadios, gfxLabels, (val) => { currentGraphics = val; });
        updateUILanguage();

        let audioContext = null; let footstepsBuffer = null; let pickupBuffer = null; let pcOffBuffer = null; let blackoutBuffer = null; let monsterSpawnBuffer = null; let monsterFootstepBuffer = null; let doorOpenBuffer = null; let deathBuffer = null; let jumpscareBuffer = null;

        function initAudio() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') audioContext.resume();
            createSounds();
        }

        function createSounds() {
            footstepsBuffer = createNoiseBuffer(0.2, 0.1, 200); pickupBuffer = createToneBuffer(0.15, 600, 'sine'); pcOffBuffer = createToneBuffer(0.2, 100, 'sawtooth'); blackoutBuffer = createNoiseBuffer(1.5, 0.3, 60); monsterSpawnBuffer = createNoiseBuffer(0.8, 0.2, 80); monsterFootstepBuffer = createToneBuffer(0.3, 60, 'triangle'); doorOpenBuffer = createToneBuffer(0.5, 400, 'sine', 0.3); deathBuffer = createNoiseBuffer(1.0, 0.5, 150);
            if (audioContext) {
                const sr = audioContext.sampleRate; jumpscareBuffer = audioContext.createBuffer(1, sr * 1.5, sr); const data = jumpscareBuffer.getChannelData(0);
                for (let i = 0; i < jumpscareBuffer.length; i++) { data[i] = (Math.random() * 2 - 1) * Math.exp(-i/(sr*0.5)); data[i] += Math.sin(i * 0.05) * 0.8 * Math.exp(-i/(sr*1.0)); }
            }
        }

        function createNoiseBuffer(duration, volume, lowpassFreq) {
            if (!audioContext) return null;
            const sampleRate = audioContext.sampleRate; const buffer = audioContext.createBuffer(1, sampleRate * duration, sampleRate); const data = buffer.getChannelData(0);
            for (let i = 0; i < buffer.length; i++) data[i] = (Math.random() * 2 - 1) * volume;
            if (lowpassFreq > 0) { const k = Math.exp(-2 * Math.PI * lowpassFreq / sampleRate); let prev = 0; for (let i = 0; i < buffer.length; i++) { data[i] = prev + (data[i] - prev) * (1 - k); prev = data[i]; } }
            return buffer;
        }

        function createToneBuffer(duration, frequency, type = 'sine', volume = 0.3) {
            if (!audioContext) return null;
            const sampleRate = audioContext.sampleRate; const buffer = audioContext.createBuffer(1, sampleRate * duration, sampleRate); const data = buffer.getChannelData(0);
            for (let i = 0; i < buffer.length; i++) data[i] = Math.sin(2 * Math.PI * frequency * i / sampleRate) * volume * (1 - i / buffer.length);
            return buffer;
        }

        function playSound(buffer, volume = 0.5, pitch = 1.0) {
            if (!audioContext || !buffer) return;
            if (audioContext.state === 'suspended') audioContext.resume();
            const source = audioContext.createBufferSource(); source.buffer = buffer; source.playbackRate.value = pitch;
            const gainNode = audioContext.createGain(); gainNode.gain.value = volume;
            source.connect(gainNode).connect(audioContext.destination); source.start();
        }

        let stepTimer = 0; function playFootstep(isSprint) { if (gameEnded) return; playSound(footstepsBuffer, isSprint ? 0.3 : 0.2, isSprint ? 1.2 : 0.8 + Math.random()*0.4); }

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.08); 

        const camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.rotation.order = 'YXZ'; 
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; 
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        renderer.outputEncoding = THREE.sRGBEncoding; 
        renderer.toneMapping = THREE.ACESFilmicToneMapping; 
        renderer.toneMappingExposure = 1.0;
        document.body.appendChild(renderer.domElement);

        let controls = { isLocked: false }; 
        let gameEnded = false; let gameWin = false; let mobileControlsInitialized = false;

        let health = 100;
        let stamina = 100;
        let isSprinting = false;
        let isSprintToggledMobile = false; 

        function applyGraphicsSettings() {
            if (currentGraphics === 'low') {
                renderer.setPixelRatio(0.7); 
                renderer.shadowMap.enabled = false;
                renderer.toneMapping = THREE.LinearToneMapping;
                floorMat.bumpMap = null; wallMatLong.bumpMap = null; wallMatShort.bumpMap = null;
            } else if (currentGraphics === 'medium') {
                renderer.setPixelRatio(1.0);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.BasicShadowMap; 
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                floorMat.bumpMap = null; wallMatLong.bumpMap = null; wallMatShort.bumpMap = null;
            } else {
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0));
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                floorMat.bumpMap = floorTex; wallMatLong.bumpMap = wallTex; wallMatShort.bumpMap = wallTexShort;
            }
            
            floorMat.needsUpdate = true; wallMatLong.needsUpdate = true; wallMatShort.needsUpdate = true;
            scene.traverse((child) => { if (child.isMesh && child.material) child.material.needsUpdate = true; });
        }

        startBtn.addEventListener('click', () => { 
            initAudio(); 
            applyGraphicsSettings(); 
            
            if (currentPlatform === 'pc') { 
                if (!controls.lock) {
                    controls = new THREE.PointerLockControls(camera, document.body);
                    controls.addEventListener('lock', () => { blocker.style.display = 'none'; bodycamUI.style.display = 'block'; updateUI(); });
                    controls.addEventListener('unlock', () => { if (!gameEnded) { blocker.style.display = 'flex'; bodycamUI.style.display = 'none'; } });
                }
                if (!gameEnded) controls.lock(); 
            } else { 
                controls.isLocked = true; 
                startMobileGame(); 
            }

            const r = 0.3; const limitX = roomW/2 - r; const limitZ = roomD/2 - r; 
            if (x < -limitX || x > limitX || z < -limitZ || z > limitZ) return true; 
            for (let obs of obstacles) if (x > obs.minX - r && x < obs.maxX + r && z > obs.minZ - r && z < obs.maxZ + r) return true;

        function animate() {
            requestAnimationFrame(animate);

            if ((controls.isLocked || currentPlatform === 'mobile') && !gameEnded) {
                const time = performance.now(); const delta = (time - prevTime) / 1000;
                
                // === ОБНОВЛЕНИЕ КЛИЕНТОВ ===
                if (!gameEnded && !isBlackout) {
                    clientSpawnTimer -= delta;
                    if (clientSpawnTimer <= 0) {
                        spawnClient();
                        clientSpawnTimer = 8 + Math.random() * 12; 
                    }

                    for (let i = clients.length - 1; i >= 0; i--) {
                        const c = clients[i];
                        
                        if (c.mixer) c.mixer.update(delta);

                        const monitorPos = new THREE.Vector3();
                        c.targetPC.getWorldPosition(monitorPos);
                        monitorPos.y = 0;

                        const deskRotation = c.targetPC.userData.deskGroup.rotation.y;
                        const directionToChair = new THREE.Vector3(0, 0, 1);
                        directionToChair.applyAxisAngle(new THREE.Vector3(0, 1, 0), deskRotation);
                        const chairPos = new THREE.Vector3().copy(monitorPos).addScaledVector(directionToChair, 0.5);

                        function processMovement(targetPos, onReach) {
                            if (c.walkAction) {
                                c.walkAction.paused = false;
                                if (!c.walkAction.isRunning()) c.walkAction.play();
                            }

                            if (c.waypoints.length === 0) {
                                const aisleX = -4.5;
                                c.waypoints = [
                                    new THREE.Vector3(aisleX, 0, c.mesh.position.z),
                                    new THREE.Vector3(aisleX, 0, targetPos.z),
                                    new THREE.Vector3(targetPos.x, 0, targetPos.z)
                                ];
                            }
                            const currentTarget = c.waypoints[0];
                            const dir = new THREE.Vector3().subVectors(currentTarget, c.mesh.position);
                            dir.y = 0;
                            
                            if (dir.length() > 0.15) {
                                dir.normalize();
                                c.mesh.position.addScaledVector(dir, c.speed * delta);
                                
                                // Плавный поворот тела к цели
                                turnDummy.position.copy(c.mesh.position);
                                turnDummy.lookAt(currentTarget.x, c.mesh.position.y, currentTarget.z);
                                c.mesh.quaternion.slerp(turnDummy.quaternion, 10 * delta);

                                c.mesh.position.y = 0; 
                            } else {
                                c.waypoints.shift();
                                if (c.waypoints.length === 0) {
                                    // Ставим на паузу, чтобы не было T-позы
                                    if (c.walkAction) c.walkAction.paused = true;
                                    onReach();
                                }
                            }
                        }

                        if (c.state === 'going_to_fridge') {
                            const fridgePos = new THREE.Vector3(-7.2, 0, -4.8);
                            processMovement(fridgePos, () => {
                                c.state = 'getting_drink';
                                c.timer = 2.0; 
                                c.mesh.position.y = 0;
                                playSound(pickupBuffer, 0.3);
                            });
                        } 
                        else if (c.state === 'getting_drink') {
                            c.timer -= delta;
                            if (c.timer <= 0) {
                                c.state = 'going_to_pc';
                                c.waypoints = []; 
                            }
                        } 
                        else if (c.state === 'going_to_pc') {
                            processMovement(chairPos, () => {
                                c.state = 'sitting';
                                c.timer = 10 + Math.random() * 10; 
                                c.targetPC.material = pcScreenMatOn; 
                                c.targetPC.userData.isOn = true;
                                c.mesh.position.copy(chairPos);
                                c.mesh.position.y = 0; 
                                c.mesh.rotation.y = deskRotation + Math.PI; 
                                updateUI();
                            });
                        } 
                        else if (c.state === 'sitting') {
                            c.timer -= delta;
                            if (c.timer <= 0) {
                                c.state = 'leaving';
                                c.waypoints = []; 
                                c.mesh.position.y = 0; 
                                c.targetPC.userData.reserved = false; 
                                if (c.wantsDrink) spawnTrashAt(c.targetPC.userData.deskGroup); 
                            }
                        } 
                        else if (c.state === 'leaving') {
                            const doorPos = new THREE.Vector3(-roomW/2 + 0.5, 0, 3.5);
                            processMovement(doorPos, () => {
                                scene.remove(c.mesh);
                                clients.splice(i, 1);
                                playSound(doorOpenBuffer, 0.4);
                            });
                        }
                    }
                }
                // === КОНЕЦ БЛОКА КЛИЕНТОВ ===

                velocity.x -= velocity.x * 10.0 * delta; velocity.z -= velocity.z * 10.0 * delta;
                
                let isInputActive = false;

                if (currentPlatform === 'pc') {
                    direction.z = Number(moveForward) - Number(moveBackward); 
                    direction.x = Number(moveRight) - Number(moveLeft); 
                    direction.normalize();
                    isInputActive = (moveForward || moveBackward || moveLeft || moveRight);
                } else {
                    direction.x = joystickVector.x; direction.z = -joystickVector.y; 
                    isInputActive = (Math.abs(joystickVector.x) > 0.1 || Math.abs(joystickVector.y) > 0.1);
                }

                let currentSpeed = 13.0;
                if (isInputActive) {
                    if (isSprinting && stamina > 0) {
                        currentSpeed = 22.0; stamina -= delta * 25; 
                    } else {
                        stamina += delta * 10; 
                        if (stamina <= 0 && isSprintToggledMobile) {
                            isSprintToggledMobile = false; isSprinting = false; sprintBtn.classList.remove('sprint-active');
                        }
                    }
                } else { stamina += delta * 20; }
                stamina = Math.max(0, Math.min(100, stamina));
                
                if (isInputActive || velocity.length() > 0.1) {
                    velocity.z -= direction.z * currentSpeed * delta;
                    velocity.x -= direction.x * currentSpeed * delta;
                }

                const oldX = camera.position.x; const oldZ = camera.position.z;

                if (currentPlatform === 'pc') {
                    controls.moveRight(-velocity.x * delta); controls.moveForward(-velocity.z * delta);
                } else {
                    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                    forward.y = 0; forward.normalize(); right.y = 0; right.normalize();
                    camera.position.addScaledVector(forward, -velocity.z * delta); 
                    camera.position.addScaledVector(right, -velocity.x * delta);
                }

                const newX = camera.position.x; const newZ = camera.position.z;
                let colX = checkCollision(newX, oldZ); let colZ = checkCollision(oldX, newZ); let colBoth = checkCollision(newX, newZ);

                if (colX) camera.position.x = oldX; if (colZ) camera.position.z = oldZ;
                if (!colX && !colZ && colBoth) { camera.position.x = oldX; camera.position.z = oldZ; }
                camera.position.y = 1.7; 

                if (isInputActive) {
                    stepAccum += delta; const stepThreshold = (currentSpeed > 15) ? 0.3 : 0.5; 
                    if (stepAccum > stepThreshold) { playFootstep(currentSpeed > 15); stepAccum = 0; } 
                    idleTimer = 0;
                } else {
                    stepAccum = 0; idleTimer += delta; if (idleTimer >= IDLE_TIME && !monsters[2].spawned) spawnMonster(2);
                }

                if (!isBlackout) {
                    const elapsedTime = clock.getElapsedTime(); const r = Math.sin(elapsedTime * 0.5) * 0.5 + 0.5; const g = Math.sin(elapsedTime * 0.5 + Math.PI/2) * 0.5 + 0.5; const b = Math.sin(elapsedTime * 0.5 + Math.PI) * 0.5 + 0.5;
                    rgbLedStripMat.emissive.setRGB(r, g, b); 
                } else if (isBlackout && hasFlashlight) {
                    const elapsedTime = clock.getElapsedTime(); const flicker = Math.sin(elapsedTime * 20) * 0.2 + 0.8;
                    playerFlashlight.intensity = 2.5 * flicker;
                }

                if (spookyEventTriggered && monitorsTurnedOff < 20) {
                    spookyFrameTimer += delta;
                    if (spookyFrameTimer > 0.05) {
                        spookyFrameTimer = 0; currentSpookyFrame = (currentSpookyFrame + 1) % spookyFrames.length;
                        pcScreenMatSpooky.map = spookyFrames[currentSpookyFrame]; pcScreenMatSpooky.emissiveMap = spookyFrames[currentSpookyFrame];
                    }
                    spookyLight.intensity = 1.5 + Math.random() * 2.0; 
                }

                let diffSpeedMulti = 1.0; let diffDamageMulti = 0.5; 
                if (currentDifficulty === 'easy') { diffSpeedMulti = 0.7; diffDamageMulti = 0; } 
                else if (currentDifficulty === 'hard') { diffSpeedMulti = 1.4; diffDamageMulti = 1.0; }

                let isTakingDamage = false;
                
                for (let i = 0; i < monsters.length; i++) {
                    const m = monsters[i];
                    if (m.active && m.group.visible) {
                        const elapsed = clock.getElapsedTime();
                        if (m.useCustomAnimation) {
                            m.group.position.y = Math.sin(elapsed * 3 + i) * 0.1; m.group.rotation.z = Math.sin(elapsed * 2 + i) * 0.05;
                            const scale = 1.0 + Math.sin(elapsed * 5 + i) * 0.02; m.group.scale.set(scale, scale, scale);
                        }
                        
                        const lookDirToMonster = new THREE.Vector3().subVectors(m.group.position, camera.position);
                        lookDirToMonster.y = 0; const distance = lookDirToMonster.length(); lookDirToMonster.normalize();
                        const moveDirToPlayer = new THREE.Vector3().copy(lookDirToMonster).negate();

                        const lookDir = camera.getWorldDirection(new THREE.Vector3()); lookDir.y = 0; lookDir.normalize();
                        const isLookingAtMonster = (lookDir.angleTo(lookDirToMonster) < 0.5) && (distance < 15.0);

                        if (isLookingAtMonster) {
                            m.stareTime += delta;
                            noiseOpacity = Math.max(noiseOpacity, 0.2 + m.stareTime * 0.5); 
                            if (m.stareTime > 0.8) {
                                m.group.visible = false; m.lookAwayTimer = 10.0 + Math.random() * 3.0; m.stareTime = 0;
                                playSound(monsterSpawnBuffer, 0.2, 1.5); 
                            }
                        } else {
                            m.stareTime = 0;
                            if (distance > 2.0) {
                                m.group.position.x += moveDirToPlayer.x * m.speed * diffSpeedMulti * delta;
                                m.group.position.z += moveDirToPlayer.z * m.speed * diffSpeedMulti * delta;
                                m.group.lookAt(camera.position.x, 0, camera.position.z);
                                if (Math.random() < delta * 2) playSound(monsterFootstepBuffer, 0.15, 0.7 + Math.random()*0.3);
                            } else {
                                if (diffDamageMulti > 0) { isTakingDamage = true; health -= delta * 70 * diffDamageMulti; noiseOpacity = Math.max(noiseOpacity, 0.85); }
                            }
                        }
                    } else if (m.lookAwayTimer > 0) {
                        m.lookAwayTimer -= delta;
                        if (m.lookAwayTimer <= 0) {
                            const lookDir = camera.getWorldDirection(new THREE.Vector3()); lookDir.y = 0; lookDir.normalize();
                            let spawnX = camera.position.x - (lookDir.x * 5); let spawnZ = camera.position.z - (lookDir.z * 5);
                            spawnX = Math.max(-roomW/2 + 1, Math.min(roomW/2 - 1, spawnX)); spawnZ = Math.max(-roomD/2 + 1, Math.min(roomD/2 - 1, spawnZ));
                            m.group.position.set(spawnX, 0, spawnZ); m.group.visible = true; m.lookAwayTimer = 0; playSound(monsterSpawnBuffer, 0.3);
                        }
                    }
                }
                
                if (isTakingDamage) { bodycamUI.style.boxShadow = "inset 0 0 150px rgba(255, 0, 0, 0.8)"; } 
                else { bodycamUI.style.boxShadow = "inset 0 0 150px rgba(0, 0, 0, 0.9)"; if (noiseOpacity > 0 && !spookyEventTriggered) noiseOpacity -= delta * 2; }
                
                if (health <= 0) { health = 0; endGame(false); }

                updateUI(); 
                prevTime = time;
            }
            for (let m of monsters) if (m.mixer) m.mixer.update(clock.getDelta());
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    </script>
</body>
</html>
