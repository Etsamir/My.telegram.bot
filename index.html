<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini App</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #000, #1a1a1a);
        color: #fff;
    }

    .container {
        width: 90%;
        margin: auto;
        padding-top: 20px;
    }

    .profile {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .avatar {
        width: 70px;
        height: 70px;
        background: #444;
        border-radius: 50%;
    }

    .name {
        font-size: 24px;
        font-weight: bold;
    }

    .id {
        color: #9c9c9c;
        margin-top: 3px;
    }

    .balance-card {
        margin-top: 25px;
        padding: 20px;
        border-radius: 16px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.15);
        position: relative;
    }

    .currency-switch {
        position: absolute;
        top: 15px;
        right: 15px;
        display: flex;
        gap: 5px;
        background: rgba(255,255,255,0.1);
        padding: 5px 10px;
        border-radius: 10px;
        font-size: 12px;
    }

    .money {
        font-size: 42px;
        font-weight: bold;
        margin-top: 20px;
    }

    .btn-group {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
    }

    .btn {
        width: 48%;
        padding: 12px 0;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.25);
        background: rgba(0,0,0,0.3);
        color: #fff;
        font-weight: bold;
        text-align: center;
        cursor: pointer;
    }

    .grid {
        margin-top: 25px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .card {
        padding: 25px 10px;
        border-radius: 16px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.15);
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        position: relative;
    }

    .icon {
        font-size: 32px;
        margin-bottom: 10px;
    }
</style>
</head>

<body>
<div class="container">

    <div class="profile">
        <div class="avatar"></div>
        <div>
            <div class="name">NAME</div>
            <div class="id">12345678</div>
        </div>
    </div>

    <div class="balance-card">
        <div class="currency-switch">
            <div>USD</div>
            <div>UZS</div>
        </div>
        <div class="money">$ 0.00</div>

        <div class="btn-group">
            <div class="btn" onclick="alert('Пополнить')">Пополнить</div>
            <div class="btn" onclick="alert('Вывести')">Вывести</div>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="icon">🧩</div>
            GAME
        </div>

        <div class="card">
            <div class="icon">🏆</div>
            TOUR
        </div>

        <div class="card">
            <div class="icon">🔑</div>
            CODE
        </div>

        <div class="card">
            <div class="icon">👑</div>
            BOSS
        </div>
    </div>

</div>

<script>
    console.log("Mini App Loaded!");
</script>

</body>
</html>
