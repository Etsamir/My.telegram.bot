<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Market - Vitrina</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg-color: #0d0d0d; --box-color: #d9d9d9; --dark-box: #404040; --text-color: #000000; --active-color: #ffffff; }
        body { margin: 0; padding: 20px; background-color: var(--bg-color); color: white; font-family: 'Arial Black', Impact, sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none !important; }

        /* 1-SAHIFA: O'YIN TANLASH */
        #screen-selection { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 90vh; gap: 30px; }
        .games-grid { display: grid; grid-template-columns: repeat(2, 110px); gap: 15px; }
        .game-box { background-color: var(--box-color); height: 110px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: var(--text-color); font-size: 16px; cursor: pointer; text-transform: lowercase; }

        /* 2-SAHIFA: DO'KON */
        #screen-store { display: flex; flex-direction: column; gap: 25px; }
        .header { display: flex; justify-content: space-between; align-items: center; height: 45px; gap: 15px; }
        .logo-box { background-color: var(--box-color); height: 100%; flex-grow: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--text-color); font-size: 22px; text-transform: lowercase; }
        
        .categories { display: flex; justify-content: space-between; gap: 10px; }
        .category-box { background-color: var(--box-color); height: 50px; flex: 1; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-color); font-size: 14px; cursor: pointer; opacity: 0.6; }
        .category-box.active { opacity: 1; border: 2px solid var(--active-color); }

        /* E'LONLAR KARTASI */
        .feed { display: flex; flex-direction: column; gap: 20px; padding-bottom: 20px; }
        .card { background-color: var(--dark-box); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .card-img { width: 100%; height: 180px; background-color: #222; object-fit: cover; }
        .card-info { padding: 12px; display: flex; flex-direction: column; gap: 5px; }
        .card-title { font-size: 16px; text-transform: lowercase; }
        .card-price { font-size: 14px; color: #ffcc00; }
        .card-owner { font-size: 12px; color: #aaa; text-transform: lowercase;}
        .buy-btn { background-color: var(--box-color); border: none; padding: 8px; margin-top: 5px; border-radius: 6px; font-family: inherit; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="screen-selection">
        <div class="games-grid">
            <div class="game-box" onclick="openStore('codm')">codm</div>
            <div class="game-box" onclick="openStore('pubg')">pubg</div>
            <div class="game-box" onclick="openStore('standoff 2')">standoff2</div>
            <div class="game-box" onclick="openStore('ff')">ff</div>
        </div>
        <div style="font-size: 24px; text-transform: lowercase;">o'yin tanlang</div>
    </div>

    <div id="screen-store" class="hidden">
        <div class="header">
            <div class="logo-box" id="logo-text">logo</div>
        </div>

        <div class="categories">
            <div class="category-box active" id="btn-akk" onclick="switchTab('akk')">akk</div>
            <div class="category-box" id="btn-cp" onclick="switchTab('cp')">cp/uc</div>
            <div class="category-box" id="btn-boost" onclick="switchTab('boost')">boost</div>
        </div>

        <div id="tab-akk" class="feed tab-content"></div>
        <div id="tab-cp" class="feed tab-content hidden"><div style="text-align:center; color:#888;">cp paketlar</div></div>
        <div id="tab-boost" class="feed tab-content hidden"><div style="text-align:center; color:#888;">xizmatlar</div></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        // Vaqtincha namunaviy bazamiz (Keyinchalik buni botdan tortib oladigan qilamiz)
        const dummyAds = [
            { id: 1, game: "pubg", title: "m416 lednik 5-lvl, 70 ustr", price: "450 000", owner: "@pro_gamer", img: "https://i.ytimg.com/vi/q1R22_7l6fQ/maxresdefault.jpg" },
            { id: 2, game: "codm", title: "mythic fennec, 12 efsane", price: "800 000", owner: "@codm_seller", img: "https://zilliongamer.com/uploads/codm/news/2020/11/fennec-ascended-mythic.jpg" },
            { id: 3, game: "standoff 2", title: "karambit gold, 50 lvl", price: "200 000", owner: "@standoff_king", img: "https://i.ytimg.com/vi/3hF_L4vX3gM/maxresdefault.jpg" }
        ];

        function openStore(gameName) {
            document.getElementById('screen-selection').classList.add('hidden');
            document.getElementById('screen-store').classList.remove('hidden');
            document.getElementById('logo-text').innerText = gameName;
            
            tg.BackButton.show();
            tg.BackButton.onClick(() => {
                document.getElementById('screen-store').classList.add('hidden');
                document.getElementById('screen-selection').classList.remove('hidden');
                tg.BackButton.hide();
            });

            loadAds(gameName);
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.category-box').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.remove('hidden');
            document.getElementById('btn-' + tabName).classList.add('active');
        }

        // HTML ga e'lonlarni chizish funksiyasi
        function loadAds(gameName) {
            const container = document.getElementById('tab-akk');
            container.innerHTML = ""; // Eskinini tozalash
            
            // Faqat tanlangan o'yin e'lonlarini ajratib olish
            const filteredAds = dummyAds.filter(ad => ad.game === gameName);

            if(filteredAds.length === 0) {
                container.innerHTML = "<div style='text-align:center; color:#888;'>hozircha bu o'yinga e'lon yo'q</div>";
                return;
            }

            filteredAds.forEach(ad => {
                const card = document.createElement('div');
                card.className = "card";
                card.innerHTML = `
                    <img src="${ad.img}" class="card-img" alt="rasm">
                    <div class="card-info">
                        <div class="card-title">${ad.title}</div>
                        <div class="card-price">${ad.price} so'm</div>
                        <div class="card-owner">Sotuvchi: ${ad.owner}</div>
                        <button class="buy-btn" onclick="buyItem('${ad.owner}')">Sotib olish</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function buyItem(owner) {
            tg.showAlert(`Sotib olish uchun sotuvchiga yozing: ${owner}`);
        }
    </script>
</body>
</html>
